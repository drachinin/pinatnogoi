<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ПИНАЙ ДАЛЬШЕ!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#221d14; --paper:#fff6e0; --yellow:#ffc400; --yellow2:#ffb000;
  --green:#3ec46d; --green2:#2fa35a; --red:#ff5a4e; --orange:#ff8a2a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#f6e3c2;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;display:block}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 62%,rgba(30,20,5,.22) 100%);z-index:2}
#touchLayer{position:fixed;inset:0;z-index:3;touch-action:none}
#stickBase,#stickDot{position:fixed;border-radius:50%;pointer-events:none;z-index:4;display:none}
#stickBase{width:110px;height:110px;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);transform:translate(-50%,-50%)}
#stickDot{width:46px;height:46px;background:rgba(255,255,255,.65);border:3px solid rgba(34,29,20,.35);transform:translate(-50%,-50%)}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;
  padding:7px 16px 7px 10px;font-weight:800;font-size:20px;border:3px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.pill svg{width:24px;height:24px}
#topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;gap:10px}
#coinPill{pointer-events:none}
#coinPill.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.18)}}
#lvlBox{flex:1;display:none;flex-direction:column;align-items:center;gap:4px}
#lvlGoal{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 14px;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#lvlGoal b{color:var(--green2)}
#timeBar{width:180px;height:14px;background:var(--paper);border:3px solid var(--ink);border-radius:99px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#timeFill{height:100%;width:100%;background:var(--green);transition:width .2s linear}
#timeFill.low{background:var(--red)}
.sqBtn{pointer-events:auto;width:52px;height:52px;border-radius:16px;background:var(--yellow);border:3px solid var(--ink);
  box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sqBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.sqBtn svg{width:28px;height:28px}
#hint{position:absolute;bottom:190px;left:50%;transform:translateX(-50%);background:rgba(34,29,20,.85);color:#ffe9b0;
  padding:8px 18px;border-radius:999px;font-weight:700;font-size:16px;white-space:nowrap;transition:opacity .3s}
/* кнопка пинка */
#kickWrap{position:absolute;right:22px;bottom:26px;width:132px;height:132px;pointer-events:none}
#kickBtn{position:absolute;inset:0;border-radius:50%;background:var(--red);border:4px solid var(--ink);
  box-shadow:0 7px 0 var(--ink), inset 0 -10px 0 rgba(0,0,0,.18);color:#fff;font-family:inherit;font-weight:800;
  font-size:24px;letter-spacing:.5px;cursor:pointer;pointer-events:auto;opacity:0;transition:opacity .25s;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#kickBtn.show{opacity:1}
#kickBtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
#chargeSvg{position:absolute;inset:-14px;pointer-events:none;transform:rotate(-90deg)}
/* полоса силы */
#powerBar{position:absolute;left:24px;bottom:30px;width:26px;height:190px;background:var(--paper);border:3px solid var(--ink);
  border-radius:99px;overflow:hidden;opacity:0;transition:opacity .2s;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#powerFill{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(#ffd94e,#ff8a2a,#ff5a4e)}
#powerBar .perf{position:absolute;left:0;right:0;bottom:85%;height:15%;background:rgba(62,196,109,.55);border-top:2px solid var(--green2)}
#powerBar.show{opacity:1}
/* плавающие тексты */
.floaty{position:fixed;z-index:7;pointer-events:none;font-weight:800;transform:translate(-50%,-50%);
  text-shadow:0 2px 0 rgba(0,0,0,.4);animation:rise 1.4s forwards}
@keyframes rise{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:-90px}}
/* тосты */
#toasts{position:fixed;bottom:210px;left:50%;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#ffe9b0;border:3px solid #000;border-radius:14px;padding:8px 20px;font-weight:800;font-size:18px;
  box-shadow:0 5px 0 rgba(0,0,0,.35);animation:toastIn .25s, toastOut .3s 1.8s forwards}
.toast.bad{background:var(--red);color:#fff}
.toast.good{background:var(--green);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.8)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-16px)}}
/* ---------- ПАНЕЛИ ---------- */
.screen{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column}
.screen.open{display:flex}
.dim{background:rgba(25,18,8,.35)}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 9px 0 var(--ink);
  padding:26px 30px;max-width:520px;width:calc(100% - 36px);text-align:center;animation:panelIn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(40px) scale(.9)}}
.bigTitle{font-size:clamp(40px,9vw,64px);font-weight:800;color:var(--yellow);-webkit-text-stroke:3px var(--ink);
  text-shadow:0 5px 0 var(--ink);transform:rotate(-2.5deg);line-height:.95;margin-bottom:6px}
.sub{font-weight:700;font-size:18px;color:#6b5a3a;margin-bottom:22px}
.btn{font-family:inherit;font-weight:800;font-size:22px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);
  border-radius:18px;padding:12px 26px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:10px;margin:6px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.green{background:var(--green);color:#fff}
.btn.grey{background:#e8dfc8}
.btn.big{font-size:26px;padding:15px 34px;width:100%;justify-content:center;margin:7px 0}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
.btn svg{width:24px;height:24px}
/* магазин */
#shopPanel{max-width:560px;padding:0;overflow:hidden;text-align:left}
#shopHead{display:flex;align-items:center;gap:10px;padding:16px 18px;background:var(--yellow);border-bottom:4px solid var(--ink)}
#shopHead h2{font-size:26px;font-weight:800;flex:1}
#shopTabs{display:flex;gap:8px;padding:12px 18px 0}
.tab{flex:1;font-family:inherit;font-weight:800;font-size:16px;padding:9px 0;border:3px solid var(--ink);border-radius:14px;
  background:#efe6cd;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.tab.on{background:var(--ink);color:var(--yellow)}
#shopList{max-height:min(52vh,430px);overflow-y:auto;padding:14px 18px 20px;touch-action:pan-y}
.upg{border:3px solid var(--ink);border-radius:18px;padding:12px 14px;margin-bottom:12px;background:#fffdf4;box-shadow:0 4px 0 rgba(34,29,20,.22)}
.upg .row1{display:flex;align-items:center;gap:10px}
.upg .ic{width:42px;height:42px;border-radius:12px;background:var(--yellow);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.upg .ic svg{width:24px;height:24px}
.upg .nm{flex:1;min-width:0}
.upg .nm b{font-size:18px;display:block}
.upg .nm span{font-size:13px;font-weight:700;color:#8a7a55}
.upg .buy{font-family:inherit;font-weight:800;font-size:16px;background:var(--green);color:#fff;border:3px solid var(--ink);
  border-radius:12px;padding:8px 12px;cursor:pointer;box-shadow:0 4px 0 var(--ink);white-space:nowrap;display:flex;gap:6px;align-items:center}
.upg .buy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.upg .buy:disabled{background:#cfc7b0;color:#7d745d}
.upg .buy svg{width:17px;height:17px}
.segs{display:flex;gap:3px;margin-top:10px}
.seg{flex:1;height:10px;border-radius:4px;background:#e2d8bc;border:1.5px solid rgba(34,29,20,.35)}
.seg.on{background:var(--orange)}
.seg.max{background:var(--green)}
/* результат */
.stars{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
.stars svg{width:58px;height:58px}
.statRow{display:flex;justify-content:space-between;font-weight:800;font-size:19px;padding:7px 4px;border-bottom:2px dashed #d8cba6}
.statRow b{color:var(--green2)}
.praise{margin:14px 0 6px;font-weight:800;font-size:20px;color:var(--orange);line-height:1.25}
.praise small{display:block;color:#6b5a3a;font-size:16px;margin-top:2px}
#confettiCv{position:fixed;inset:0;z-index:12;pointer-events:none}
@media (max-width:520px){ .pill{font-size:16px;padding:5px 12px 5px 8px} #kickWrap{width:112px;height:112px} #kickBtn{font-size:20px} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="touchLayer"></div>
<div id="stickBase"></div><div id="stickDot"></div>

<div id="hud">
  <div id="topbar">
    <div class="pill" id="coinPill"><span id="coinIco"></span><span id="coinVal">0</span></div>
    <div id="lvlBox">
      <div id="lvlGoal">Цель: <b id="goalVal">0</b> · <span id="scoreVal">0</span></div>
      <div id="timeBar"><div id="timeFill"></div></div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="sqBtn" id="shopBtn" title="Прокачка"><span id="shopIco"></span></div>
      <div class="sqBtn" id="exitBtn" title="Закончить"><span id="exitIco"></span></div>
    </div>
  </div>
  <div id="hint">Проведи пальцем по экрану — подойди к предмету</div>
  <div id="powerBar"><div class="perf"></div><div id="powerFill"></div></div>
  <div id="kickWrap">
    <svg id="chargeSvg" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(34,29,20,.25)" stroke-width="9"/>
      <circle id="perfArc" cx="80" cy="80" r="70" fill="none" stroke="#3ec46d" stroke-width="9"
        stroke-dasharray="66 373.7" stroke-dashoffset="-373.8" stroke-linecap="round" opacity=".9"/>
      <circle id="chargeArc" cx="80" cy="80" r="70" fill="none" stroke="#ffc400" stroke-width="11"
        stroke-dasharray="439.8" stroke-dashoffset="439.8" stroke-linecap="round"/>
    </svg>
    <button id="kickBtn">ПИНОК</button>
  </div>
</div>

<div id="toasts"></div>

<div class="screen open" id="menu">
  <div style="text-align:center;margin-bottom:26px">
    <div class="bigTitle">ПИНАЙ<br>ДАЛЬШЕ!</div>
    <div class="sub">пни её через весь мир, чемпион</div>
  </div>
  <div class="pill" id="menuCoins" style="margin-bottom:24px;font-size:24px"><span class="coinIco2"></span><span id="menuCoinVal">0</span></div>
  <button class="btn green big" id="btnFree"><span data-ico="play"></span>СВОБОДНЫЙ ЗАБЕГ</button>
  <button class="btn big" id="btnLevel"><span data-ico="clock"></span>УРОВНИ</button>
  <div class="sub" style="margin-top:14px;font-size:14px">Свайп по экрану — ходьба и прицел · зажми ПИНОК — сила удара</div>
</div>

<div class="screen dim" id="shop">
  <div class="panel" id="shopPanel">
    <div id="shopHead"><h2>ПРОКАЧКА</h2><div class="pill" style="font-size:17px"><span class="coinIco2"></span><span id="shopCoins">0</span></div>
      <div class="sqBtn" id="shopClose"><span data-ico="x"></span></div></div>
    <div id="shopTabs">
      <button class="tab on" data-t="leg">НОГА</button>
      <button class="tab" data-t="item">ПРЕДМЕТ</button>
      <button class="tab" data-t="surf">ПОВЕРХНОСТЬ</button>
    </div>
    <div id="shopList"></div>
  </div>
</div>

<div class="screen dim" id="result">
  <div class="panel">
    <div class="bigTitle" style="font-size:clamp(30px,7vw,44px)" id="resTitle">УРОВЕНЬ ПРОЙДЕН!</div>
    <div class="stars" id="resStars"></div>
    <div id="resStats"></div>
    <div class="praise" id="resPraise"></div>
    <button class="btn green big" id="btnAgain"><span data-ico="play"></span>ЕЩЁ РАЗ, КРАСАВЧИК!</button>
    <button class="btn grey big" id="btnMenu"><span data-ico="home"></span>В МЕНЮ</button>
  </div>
</div>

<canvas id="confettiCv"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ПИНАЙ ДАЛЬШЕ! — симулятор бесконечного пинка
   ============================================================ */
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

/* ---------- SVG-иконки ---------- */
const ICO={
coin:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#ffc400" stroke="#8a5a00" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="#ffdd66" stroke="#8a5a00" stroke-width="1.6"/><path d="M9 7.5a6 6 0 0 1 5 .5" stroke="#fff3c8" stroke-width="2" stroke-linecap="round"/></svg>',
boot:'<svg viewBox="0 0 24 24" fill="none"><path d="M7 3h6v9l6 4v4H7c-2 0-3-1-3-3V5c0-1.4.8-2 3-2z" fill="currentColor" stroke="#221d14" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 15h9" stroke="#221d14" stroke-width="1.6"/></svg>',
rock:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 16 8 7l7-2 5 6-3 7H7z" fill="currentColor" stroke="#221d14" stroke-width="1.6" stroke-linejoin="round"/><path d="m8 7 4 5 8-1M12 12l-2 8" stroke="#221d14" stroke-width="1.2"/></svg>',
layers:'<svg viewBox="0 0 24 24" fill="none"><path d="m12 3 9 5-9 5-9-5z" fill="currentColor" stroke="#221d14" stroke-width="1.6" stroke-linejoin="round"/><path d="m4.5 12.5 7.5 4.2 7.5-4.2M4.5 16.5 12 20.7l7.5-4.2" stroke="#221d14" stroke-width="1.6" stroke-linecap="round"/></svg>',
clock:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="currentColor" stroke="#221d14" stroke-width="2"/><path d="M12 7v5l3.5 2" stroke="#221d14" stroke-width="2" stroke-linecap="round"/></svg>',
star:'<svg viewBox="0 0 24 24"><path d="m12 2 3 6.6 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.2l1.4-7L2 9.4l7-.8z" fill="#ffc400" stroke="#221d14" stroke-width="1.6" stroke-linejoin="round"/></svg>',
starOff:'<svg viewBox="0 0 24 24"><path d="m12 2 3 6.6 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.2l1.4-7L2 9.4l7-.8z" fill="#d8cba6" stroke="#a89870" stroke-width="1.6" stroke-linejoin="round"/></svg>',
play:'<svg viewBox="0 0 24 24"><path d="M7 4.5 19.5 12 7 19.5z" fill="currentColor"/></svg>',
x:'<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>',
home:'<svg viewBox="0 0 24 24" fill="none"><path d="m3 11 9-8 9 8v9a1.5 1.5 0 0 1-1.5 1.5H15v-7h-6v7H4.5A1.5 1.5 0 0 1 3 20z" fill="currentColor" stroke="#221d14" stroke-width="1.6" stroke-linejoin="round"/></svg>',
bag:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 8h14l-1.2 12.2a1.6 1.6 0 0 1-1.6 1.4H7.8a1.6 1.6 0 0 1-1.6-1.4z" fill="currentColor" stroke="#221d14" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10" stroke="#221d14" stroke-width="1.8" stroke-linecap="round"/></svg>',
flag:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 21V4" stroke="#221d14" stroke-width="2.4" stroke-linecap="round"/><path d="M5 4h13l-3.5 4L18 12H5z" fill="currentColor" stroke="#221d14" stroke-width="1.6" stroke-linejoin="round"/></svg>',
bolt:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="currentColor" stroke="#221d14" stroke-width="1.4" stroke-linejoin="round"/></svg>'
};
 $('coinIco').innerHTML=ICO.coin;
document.querySelectorAll('.coinIco2').forEach(e=>e.innerHTML=ICO.coin);
 $('shopIco').innerHTML=ICO.bag; $('exitIco').innerHTML=ICO.flag;
document.querySelectorAll('[data-ico]').forEach(e=>e.innerHTML=ICO[e.dataset.ico]);

/* ---------- ДАННЫЕ ПРОКАЧКИ ---------- */
const LEGS=[
 {n:'Косточка',  pow:.55,r:.038},
 {n:'Тросточка', pow:.70,r:.046},
 {n:'Худышка',   pow:.85,r:.056},
 {n:'Жилка',     pow:1.0,r:.066},
 {n:'Икорка',    pow:1.15,r:.076,calf:1},
 {n:'Бедро',     pow:1.3,r:.086,calf:1},
 {n:'Качок',     pow:1.5,r:.096,calf:1.4},
 {n:'Спортивная',pow:1.7,r:.10,calf:1.4,pants:'#3a4048',shorts:1},
 {n:'Труселя',   pow:1.9,r:.104,calf:1.4,pants:'#7a4a30',shorts:1},
 {n:'Джинсы',    pow:2.1,r:.108,calf:1.4,pants:'#4a6274',shoe:'#8a7a5a'},
 {n:'Спортивки', pow:2.3,r:.11,calf:1.4,pants:'#23262e',stripe:'#ffc400',shoe:'#e8e2d0'},
 {n:'Карго',     pow:2.5,r:.113,calf:1.4,pants:'#8a7a55',shoe:'#4a4438'},
 {n:'Брюки',     pow:2.7,r:.116,calf:1.4,pants:'#2c2c34',shoe:'#1c1a18',shine:1},
 {n:'Золотая',   pow:2.9,r:.119,calf:1.5,pants:'#d8a63a',metal:1,shoe:'#fff2cc',stripe:'#fff'},
 {n:'КЛЮШКА',    pow:3.2,club:1}
];
const ITEMS=[
 {n:'Веточка',mult:1},{n:'Палочка',mult:1.8},{n:'Шишка',mult:2.6},{n:'Камушек',mult:3.4},
 {n:'Банка',mult:4.3},{n:'Бутылка',mult:5.2},{n:'Телефон',mult:6.2},{n:'Гантелька',mult:7.2},
 {n:'Ядро',mult:8.2},{n:'Шайба',mult:9.5}
];
const SURFS=[
 {n:'Трава', roll:.60,c1:'#5d8f3c',c2:'#6fa04a',rough:.95,decor:['tree','bush','tree']},
 {n:'Грязь', roll:.75,c1:'#7a5c3c',c2:'#8a6c48',rough:.95,decor:['bush','rock']},
 {n:'Песок', roll:.90,c1:'#e0c484',c2:'#e8d098',rough:1,decor:['palm','cactus']},
 {n:'Гравий',roll:1.05,c1:'#9a948a',c2:'#aaa49a',rough:.9,decor:['rock','rock']},
 {n:'Щебень',roll:1.2,c1:'#8a8a8e',c2:'#9a9aa0',rough:.85,decor:['rock','rock']},
 {n:'Плитка',roll:1.35,c1:'#b8b0a2',c2:'#c4bcb0',rough:.7,grid:32,decor:['lamp','bush']},
 {n:'Асфальт',roll:1.5,c1:'#4c4c50',c2:'#5a5a5e',rough:.85,stripe:1,decor:['lamp','lamp']},
 {n:'Бетон', roll:1.65,c1:'#a8a8a4',c2:'#b4b4b0',rough:.8,stripe:1,decor:['lamp','cone']},
 {n:'Каучук',roll:1.8,c1:'#3c4448',c2:'#464e52',rough:.9,decor:['cone','cone']},
 {n:'Настил',roll:1.95,c1:'#a07848',c2:'#ac8454',rough:.75,plank:1,decor:['lamp']},
 {n:'Паркет',roll:2.1,c1:'#b08850',c2:'#ba925c',rough:.5,plank:1,decor:['cone','bush']},
 {n:'Тартан',roll:2.25,c1:'#b4543c',c2:'#be6248',rough:.8,decor:['cone','cone']},
 {n:'Мрамор',roll:2.4,c1:'#e4e4e0',c2:'#eeeeea',rough:.35,grid:64,decor:['column','column']},
 {n:'Гранит',roll:2.6,c1:'#5c6068',c2:'#686c74',rough:.25,decor:['column']},

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay=0){
  const a=ac();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);
}

const texCache={};
function groundMat(tier){
  if(texCache[tier])return texCache[tier];
  const d=SURFS[tier],c=document.createElement('canvas');c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle=d.c1;x.fillRect(0,0,256,256);
  for(let i=0;i<850;i++){
    x.globalAlpha=rand(.12,.4);
    x.fillStyle=Math.random()<.5?d.c2:'#00000022';
    const r=rand(1,4.5);x.beginPath();x.arc(rand(0,256),rand(0,256),r,0,TAU);x.fill();
  }
  x.globalAlpha=1;
  if(d.grid){x.strokeStyle='rgba(40,34,24,.4)';x.lineWidth=2.5;
    for(let i=0;i<=256;i+=d.grid){x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.moveTo(0,i);x.lineTo(256,i);x.stroke();}}
  if(d.plank){x.strokeStyle='rgba(60,40,20,.45)';x.lineWidth=3;
    for(let i=0;i<=256;i+=26){x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke();}
    x.strokeStyle='rgba(60,40,20,.25)';
    for(let i=0;i<10;i++){const px=rand(0,256);x.beginPath();x.moveTo(px,Math.floor(rand(0,9))*26);x.lineTo(px,(Math.floor(rand(0,9))+1)*26);x.stroke();}}
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(6,5);tex.encoding=THREE.sRGBEncoding;
  const mat=new THREE.MeshStandardMaterial({map:tex,roughness:d.rough,metalness:d.metal||0});

}

function makeDecor(type){

    for(let i=0;i<3;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(rand(.5,.9),8,7),std(i?0x4e7d3a:0x5c8f42));
      s.position.set(rand(-.4,.4),h+rand(-.2,.6),rand(-.4,.4));g.add(s);}
  }else if(type==='bush'){
    for(let i=0;i<2;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(rand(.3,.5),7,6),std(0x557d38));
      s.position.set(rand(-.3,.3),rand(.15,.4),rand(-.3,.3));g.add(s);}
  }else if(type==='palm'){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(.09,.15,2.6,7),std(0x9a7248));
    t.position.y=1.3;t.rotation.z=rand(-.15,.15);g.add(t);
    for(let i=0;i<5;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.14,1.5,5),std(0x4e8f3f));
      l.position.y=2.6;l.rotation.z=Math.PI/2.4;l.rotation.y=i*TAU/5;l.translateY(.55);l.scale.y=.35;g.add(l);}
  }else if(type==='cactus'){
    const b=new THREE.Mesh(new THREE.CylinderGeometry(.16,.18,rand(1,1.6),8),std(0x4e8f4a));b.position.y=.6;g.add(b);
    const a=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,.5,7),std(0x4e8f4a));
    a.position.set(.3,rand(.6,1),0);a.rotation.z=-.9;g.add(a);
  }else if(type==='rock'){
    const r=new THREE.Mesh(new THREE.IcosahedronGeometry(rand(.3,.7),0),std(0x8a8a86,.95));
    r.position.y=rand(.1,.25);r.rotation.set(rand(0,3),rand(0,3),0);r.scale.y=.7;g.add(r);

    arm.rotation.z=Math.PI/2;arm.position.set(.4,3.35,0);g.add(arm);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.16,8,7),new THREE.MeshStandardMaterial({color:0xfff2c0,emissive:0xffdf90,emissiveIntensity:.7}));
    bulb.position.set(.85,3.3,0);g.add(bulb);
  }else if(type==='cone'){
    const c=new THREE.Mesh(new THREE.ConeGeometry(.22,.5,10),std(0xff7a28,.7));c.position.y=.25;g.add(c);
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.155,.19,.1,10),std(0xf2f2ee,.6));
    w.position.y=.26;g.add(w);const base=new THREE.Mesh(new THREE.BoxGeometry(.42,.05,.42),std(0xff7a28,.7));base.position.y=.025;g.add(base);
  }else if(type==='column'){
    const h=rand(2.4,3.2),c=new THREE.Mesh(new THREE.CylinderGeometry(.24,.3,h,12),std(0xe8e8e2,.35,.15));
    c.position.y=h/2;g.add(c);
    const cap=new THREE.Mesh(new THREE.BoxGeometry(.72,.14,.72),std(0xdcdcd4,.35,.15));cap.position.y=h+.07;g.add(cap);
  }else if(type==='pine'){
    const h=rand(1.8,2.8);
    for(let i=0;i<3;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(.75-i*.2,1,9),std(0x3d6b46));
      s.position.y=.5+i*.62;g.add(s);}
    const sn=new THREE.Mesh(new THREE.ConeGeometry(.28,.5,9),std(0xf4f8fa,.6));sn.position.y=h+.1;g.add(sn);

function regenDecor(seg){
  while(seg.dec.children.length)seg.dec.remove(seg.dec.children[0]);

    const sc=rand(.8,1.25);d.scale.set(sc,sc,sc);
    seg.dec.add(d);
  }
}

function applyLeg(tier){
  const d=LEGS[tier];
  if(d.club){
    legR.thighM.visible=legR.shinM.visible=legR.calf.visible=legR.foot.visible=false;
    if(!legR.club){legR.club=new THREE.Group();legR.knee.add(legR.club);}
    legR.club.visible=true;
    while(legR.club.children.length)legR.club.remove(legR.club.children[0]);
    const wood=new THREE.MeshStandardMaterial({color:0xcaa06a,roughness:.7});
    const shaft=capsuleMesh(.038,.42,wood);shaft.position.y=-.2;legR.club.add(shaft);
    const blade=new THREE.Mesh(new THREE.CylinderGeometry(.055,.07,.3,10),new THREE.MeshStandardMaterial({color:0x1a1b20,roughness:.5}));
    blade.scale.y=.5;blade.rotation.x=Math.PI/2;blade.rotation.z=1.25;blade.position.set(-.12,-.44,-.02);blade.castShadow=true;legR.club.add(blade);
    const tape=new THREE.Mesh(new THREE.CylinderGeometry(.056,.058,.07,10),new THREE.MeshStandardMaterial({color:0xe8e2d0,roughness:.7}));
    tape.scale.y=.5;tape.rotation.copy(blade.rotation);tape.position.set(-.05,-.435,-.02);legR.club.add(tape);
  }else{
    if(legR.club)legR.club.visible=false;
    legR.thighM.visible=legR.shinM.visible=legR.foot.visible=true;
    const pants=d.pants?new THREE.MeshStandardMaterial({color:d.pants,roughness:d.shine?.35:.85,metalness:d.metal?.6:0}):SKIN;
    legR.thighM.children.forEach(m=>m.material=pants);
    legR.shinM.children.forEach(m=>m.material=pants);
    legR.calf.visible=!!d.calf;if(d.calf){legR.calf.material=pants;legR.calf.scale.set(1+d.calf*.3,1.4,1+d.calf*.15);}
    /* шорты-цилиндр поверх бёдер */
    if(d.shorts&&!legR.shorts){
      const sh=new THREE.Mesh(new THREE.CylinderGeometry(.075,.085,.16,10),pants);sh.position.y=-.06;legR.hip.add(sh);legR.shorts=sh;
      const sh2=sh.clone();legL.hip.add(sh2);legL.shorts=sh2;
    }
    if(legR.shorts)legR.shorts.visible=!!d.shorts;
    if(legL.shorts)legL.shorts.visible=!!d.shorts;
    legR.foot.material=new THREE.MeshStandardMaterial({color:d.shoe||0x5a5248,roughness:.6});
    legL.foot.material=legR.foot.material;
    legR.stripe.visible=legL.stripe.visible=!!d.stripe;
    if(d.stripe)legR.stripe.material=new THREE.MeshStandardMaterial({color:d.stripe,roughness:.6});
    /* пропорции */
    [legL,legR].forEach(l=>{
      const r=d.r;
      l.thighM.children.forEach(m=>{m.scale.set(r/.05,1,r/.05);});
      l.shinM.children.forEach(m=>{m.scale.set((r*.85)/.042,1,(r*.85)/.042);});
    });
  }
}

      const h=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.34,8),std(0x9a9aa0,.4,.8));
      h.rotation.z=Math.PI/2;h.position.y=.09;add(h);
      [-1,1].forEach(s=>{const d=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.07,12),std(0x33363e,.5,.6));
        d.rotation.z=Math.PI/2;d.position.set(s*.14,.09,0);add(d);});restY=.09;break;}
    case 8:{ // ядро
      const s=new THREE.Mesh(new THREE.SphereGeometry(.13,14,12),std(0x3a3d44,.4,.7));s.position.y=.13;add(s);restY=.13;break;}
    case 9:{ // шайба
      const p=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.045,20),std(0x141518,.45));p.position.y=.025;add(p);
      const e=new THREE.Mesh(new THREE.TorusGeometry(.128,.011,8,20),std(0x2e3138,.4));e.rotation.x=Math.PI/2;e.position.y=.025;add(e);
      restY=.03;break;}
  }
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  scene.add(g);
  itemObj={g,restY,tier,vel:new THREE.Vector3(),spin:new THREE.Vector3(),flying:false,rolling:false,bounces:0,startPos:new THREE.Vector3()};
  return itemObj;
}

{const dm=new THREE.MeshBasicMaterial({color:0xd8cbb0,transparent:true});
for(let i=0;i<40;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(1,6,5),dm.clone());m.visible=false;scene.add(m);dust.push({m,life:0,vel:new THREE.Vector3()});}}
function burst(pos,color,n,power){
  let c=0;
  for(const d of dust){
    if(d.life>0)continue;
    d.m.visible=true;d.m.material.color.set(color);d.m.material.opacity=.85;
    d.m.position.copy(pos).add(new THREE.Vector3(rand(-.1,.1),rand(0,.08),rand(-.1,.1)));

    d.vel.set(rand(-1,1)*power,rand(.6,1.6)*power,rand(-1,1)*power);
    d.life=rand(.4,.7);
    if(++c>=n)break;
  }
}
function updDust(dt){
  for(const d of dust){
    if(d.life<=0)continue;
    d.life-=dt;d.vel.y-=4*dt;
    d.m.position.addScaledVector(d.vel,dt);
    d.m.material.opacity=Math.max(0,d.life*1.4);
    if(d.life<=0)d.m.visible=false;
  }
}

/* физика полёта */
function simDist(force,loft,legPow,surfRoll){
  const V=4+force*9*(0.55+legPow*0.38);
  const vy=Math.sin(loft)*V,vh=Math.cos(loft)*V;
  const dAir=vh*(2*vy/9.8);
  const v=vh*0.8,dec=5/surfRoll;
  return Math.min(dAir+Math.min(v*v/(2*dec),25),80);
}
function coinsFor(dist,itemMult,surfTier,perfect){
  return Math.max(1,Math.round(dist*itemMult*(0.8+surfTier*0.06)*(perfect?1.25:1)));
}

/* запуск пинка */
function doKick(){
  if(!G.charging||G.state!=='aim')return;
  const force=G.charge;
  G.charging=false;G.state='kick';G.kickT=0;G.kickHitDone=false;
  const perfect=force>=.85;
  G.kickPowerful=force>=.92;
  /* 2% — нога пролетает выше; промах по углу > 33° */
  const whiff=Math.random()<0.02;
  const badAim=Math.abs(G.aimYaw)>0.58;
  G.kickMiss=whiff||badAim;
  G.pendingKick={force,perfect,whiff,badAim};
  if(perfect&&!G.kickMiss)toast('ИДЕАЛЬНО!','good');
  sfxWhoosh();
  hideAim();
}
function contactMoment(){
  const k=G.pendingKick;
  sfxKick(k.force);
  const foot=new THREE.Vector3();legR.ankle.getWorldPosition(foot);
  burst(new THREE.Vector3(foot.x,0.05,foot.z),SURFS[G.curSurf()].c1,8,1.2);
  if(k.whiff){toast('Нога пролетела выше! Отходим...','bad');sfxFail();return;}
  if(k.badAim){toast('Мимо! Слишком сильно промазал','bad');sfxFail();return;}
  G.lastPerfect=k.perfect;
  /* запуск предмета */
  const yaw=player.rotation.y+G.aimYaw;
  const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const legPow=LEGS[G.curLeg()].pow;
  const V=4+k.force*9*(0.55+legPow*0.38);
  itemObj.vel.set(dir.x*Math.cos(G.loft)*V,Math.sin(G.loft)*V,dir.z*Math.cos(G.loft)*V);
  itemObj.flying=true;itemObj.rolling=false;itemObj.bounces=0;
  itemObj.spin.set(rand(-6,-3),rand(-1,1),rand(-1,1));
  itemObj.startPos.copy(itemObj.g.position);
  G.state='fly';
}

/* отход назад после промаха */
function startSetback(){
  G.state='setback';G.setbackT=0;
  G.setbackFrom.copy(player.position);
  G.setbackTo.copy(player.position).add(new THREE.Vector3(0,0,2.6));
}
/* засчёт результата пинка */
function settle(){
  const dist=clamp(itemObj.g.position.distanceTo(itemObj.startPos),0,80);
  const perfect=G.lastPerfect;
  const coins=coinsFor(dist,ITEMS[G.curItem()].mult,G.curSurf(),perfect);
  S.c+=coins;save();
  G.runKicks++;if(dist>G.runBest)G.runBest=dist;G.runEarned+=coins;
  updateCoins(true);
  floatText(`+${coins}`,'#ffc400',itemObj.g.position,30);
  if(dist>3)floatText(dist.toFixed(1)+' м','#fff',itemObj.g.position.clone().add(new THREE.Vector3(0,.6,0)),22);
  sfxCoin();
  if(G.mode==='level'&&G.lvl.active){
    G.lvl.score+=coins;
    $('scoreVal').textContent=G.lvl.score;
  }
  itemObj.g.position.x=clamp(itemObj.g.position.x,-3.5,3.5);
  G.state='walk';
  setHint('Догони её и пни снова!');
}

function endRun(){

function stickShow(x,y){stick.active=true;stick.id=-2;stick.ox=x;stick.oy=y;stick.x=0;stick.y=0;
  sb.style.display=sd.style.display='block';sb.style.left=x+'px';sb.style.top=y+'px';sd.style.left=x+'px';sd.style.top=y+'px';}
function stickMove(x,y){
  let dx=x-stick.ox,dy=y-stick.oy;
  const len=Math.hypot(dx,dy),max=52;
  if(len>max){dx*=max/len;dy*=max/len;}
  stick.x=dx/max;stick.y=dy/max;
  sd.style.left=(stick.ox+dx)+'px';sd.style.top=(stick.oy+dy)+'px';
}

const cc=$('confettiCv'),cx=cc.getContext('2d');

function launchConfetti(){
  cc.width=innerWidth;cc.height=innerHeight;confetti=[];
  const cols=['#ffc400','#ff5a4e','#3ec46d','#ff8a2a','#fff6e0'];
  for(let i=0;i<150;i++)confetti.push({x:rand(0,innerWidth),y:rand(-innerHeight*.5,0),
    vx:rand(-40,40),vy:rand(120,320),w:rand(6,12),h:rand(8,16),r:rand(0,TAU),vr:rand(-4,4),c:cols[i%5]});
}
function updConfetti(dt){
  if(!confetti.length)return;
  cx.clearRect(0,0,cc.width,cc.height);
  let alive=false;
  for(const p of confetti){
    if(p.y>cc.height+30)continue;alive=true;
    p.x+=p.vx*dt+Math.sin(p.y*.02)*30*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.vy+=60*dt;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.sin(p.r)));cx.restore();
  }
  if(!alive){confetti=[];cx.clearRect(0,0,cc.width,cc.height);}
}

let walkPhase=0,idleT=0;
function animWalk(dt,speed){

  const p=walkPhase;
  legL.hip.rotation.x=Math.sin(p)*.55;
  legR.hip.rotation.x=Math.sin(p+Math.PI)*.55;
  legL.knee.rotation.x=clamp(Math.sin(p+1.1),0,1)*.85;
  legR.knee.rotation.x=clamp(Math.sin(p+1.1+Math.PI),0,1)*.85;
  legL.ankle.rotation.x=-legL.hip.rotation.x*.4;
  legR.ankle.rotation.x=-legR.hip.rotation.x*.4;
  armL.sh.rotation.x=Math.sin(p+Math.PI)*.5;armR.sh.rotation.x=Math.sin(p)*.5;
  armL.el.rotation.x=-.35-Math.abs(Math.sin(p+Math.PI))*.3;
  armR.el.rotation.x=-.35-Math.abs(Math.sin(p))*.3;
  body.position.y=Math.abs(Math.sin(p))*.05;
  body.rotation.z=Math.sin(p)*.03;
  torso.rotation.x=.07;
  armL.sh.rotation.z=.06;armR.sh.rotation.z=-.06;
}
function animIdle(dt){
  idleT+=dt;
  const b=Math.sin(idleT*2)*.02;
  [legL,legR].forEach(l=>{l.hip.rotation.x=0;l.knee.rotation.x=.03;l.ankle.rotation.x=0;});
  armL.sh.rotation.x=b;armR.sh.rotation.x=-b;
  armL.sh.rotation.z=.1;armR.sh.rotation.z=-.1;
  armL.el.rotation.x=-.25;armR.el.rotation.x=-.25;
  body.position.y=b;body.rotation.z=0;torso.rotation.x=.03;
}
function animKick(dt){
  G.kickT+=dt;
  const T=G.kickT,CONTACT=.28,DUR=.6;
  let hip,knee;
  if(T<CONTACT){ /* удар вперёд */
    const t=T/CONTACT,e=t*t;
    hip=lerp(.95,-1.35,e);knee=lerp(1.15,.12,e);
    torso.rotation.x=lerp(.12,-.1,e);
    if(!G.kickHitDone&&T>=CONTACT*.7){G.kickHitDone=true;if(!G.kickMiss)contactMoment();}
  }else{ /* возврат */
    const t=clamp((T-CONTACT)/(DUR-CONTACT),0,1);
    hip=lerp(-1.35,0,t);knee=lerp(.12,.05,t);
    torso.rotation.x=lerp(-.1,.05,t);
  }
  legR.hip.rotation.x=hip;legR.knee.rotation.x=knee;legR.ankle.rotation.x=hip*.5;
  legL.hip.rotation.x=-hip*.25;legL.knee.rotation.x=.25;
  armL.sh.rotation.x=hip*.7;armR.sh.rotation.x=-hip*.5;
  if(T>=DUR){
    G.kickHitDone=false;
    if(G.kickMiss)startSetback();
    else if(G.state==='kick')G.state='fly';
  }
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
updateCoins();
let lastT=performance.now();
const camGoalPos=new THREE.Vector3(),camGoalLook=new THREE.Vector3();

function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min((now-lastT)/1000,.05);lastT=now;
  const t=now/1000;

  /* облака дрейфуют */
  for(const c of clouds){c.position.x+=c.userData.v*dt;if(c.position.x>110)c.position.x=-110;}

  const playing=!G.paused&&G.state!=='menu'&&G.state!=='result';

  /* ---- ввод джойстика ---- */
  const jx=stick.active?stick.x:((keys.KeyA||keys.ArrowLeft)?-1:0)+((keys.KeyD||keys.ArrowRight)?1:0);
  const jy=stick.active?stick.y:((keys.KeyW||keys.ArrowUp)?1:0)+((keys.KeyS||keys.ArrowDown)?-1:0);
  const jlen=Math.hypot(jx,jy);

  const it=itemObj;
  const toItem=new THREE.Vector3().subVectors(it.g.position,player.position);toItem.y=0;
  const dItem=toItem.length();

  if(playing){
    if(G.state==='walk'){
      if(jlen>.12){
        animWalk(dt,1);
        const yaw=player.rotation.y;
        const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
        const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
        const mv=new THREE.Vector3().addScaledVector(fwd,-jy).addScaledVector(right,jx);
        mv.normalize();
        const sp=G.walkSpeed*Math.min(1,jlen*1.4);
        player.position.addScaledVector(mv,sp*dt);
        G.targetYaw=Math.atan2(-mv.x,-mv.z);
        if(dItem<1.1){ /* не пройти сквозь предмет */
          const push=toItem.clone().normalize().multiplyScalar(1.1-dItem);
          player.position.add(push.negate());
        }
        setHint(dItem<3?'':'Проведи пальцем — подойди к предмету');
      }else animIdle(dt);
      /* плавный поворот */
      let dy=G.targetYaw-G.yaw;while(dy>Math.PI)dy-=TAU;while(dy<-Math.PI)dy+=TAU;
      G.yaw+=dy*Math.min(1,dt*10);player.rotation.y=G.yaw;
      /* вход в прицеливание */
      if(dItem<2.35&&!it.flying&&!it.rolling){
        G.state='aim';
        kickBtn.classList.add('show');
        const yawToItem=Math.atan2(-toItem.x,-toItem.z);
        G.yaw=yawToItem;player.rotation.y=yawToItem;G.targetYaw=yawToItem;
        setHint('Свайп — угол пинка · Зажми ПИНОК посильнее!');
      }
    }
    else if(G.state==='aim'){
      headG.rotation.y=0;
      /* джойстик задаёт прицел */
      if(jlen>.12&&!G.charging){
        G.aimYaw=clamp(-jx*.7,-.62,.62);
        G.loft=clamp(.5-jy*.55,.15,.95);
      }
      /* поворачиваемся на предмет + отклонение */
      const toItem2=new THREE.Vector3().subVectors(it.g.position,player.position);toItem2.y=0;
      const yawToItem=Math.atan2(-toItem2.x,-toItem2.z);
      let dy=(yawToItem+G.aimYaw)-G.yaw;while(dy>Math.PI)dy-=TAU;while(dy<-Math.PI)dy+=TAU;
      G.yaw+=dy*Math.min(1,dt*8);player.rotation.y=G.yaw;
      if(G.charging){
        /* замах под пальцем */
        G.charge=Math.min(1,G.charge+dt/1.1);
        const c=G.charge;
        legR.hip.rotation.x=lerp(-.1,.95,c);legR.knee.rotation.x=lerp(.1,1.15,c);
        legR.ankle.rotation.x=legR.hip.rotation.x*.5;
        legL.hip.rotation.x=-.15;legL.knee.rotation.x=.25;
        torso.rotation.x=.12*c;
        armL.sh.rotation.x=.6*c;armR.sh.rotation.x=-.4*c;
        $('powerFill').style.height=(G.charge*100)+'%';
        $('chargeArc').style.strokeDashoffset=439.8*(1-G.charge);
        $('chargeArc').setAttribute('stroke',G.charge>=.85?'#3ec46d':'#ffc400');
      }else animIdle(dt);
      /* дуга прицела */
      arcGroup.visible=true;
      const bad=Math.abs(G.aimYaw)>.58;
      const legPow=LEGS[G.curLeg()].pow;
      const V=4+.75*9*(0.55+legPow*0.38);
      const yaw=G.yaw+G.aimYaw;
      const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
      const pos=player.position.clone().add(new THREE.Vector3(dir.x*.5,.15,dir.z*.5));
      const vel=new THREE.Vector3(dir.x*Math.cos(G.loft)*V,Math.sin(G.loft)*V,dir.z*Math.cos(G.loft)*V);
      for(let i=0;i<arcDots.length;i++){
        const tt=(i+1)*.075;
        const px=pos.x+vel.x*tt,pz=pos.z+vel.z*tt;
        let py=pos.y+vel.y*tt-4.9*tt*tt;
        if(py<it.restY)py=it.restY+.02;
        arcDots[i].position.set(px,py,pz);
        arcDots[i].material.color.set(bad?0xff5a4e:0xffc400);
        const s=.9-i*.045;arcDots[i].scale.set(s,s,s);
      }
      /* вышли из радиуса — back to walk */
      if(dItem>2.7&&!G.charging){G.state='walk';hideAim();}
    }
    else if(G.state==='kick'){
      animKick(dt);
    }
    else if(G.state==='setback'){
      G.setbackT+=dt;
      animWalk(dt,1);
      const t2=clamp(G.setbackT/1.2,0,1);
      player.position.lerpVectors(G.setbackFrom,G.setbackTo,t2);
      const look=Math.atan2(-(it.g.position.x-player.position.x),-(it.g.position.z-player.position.z));
      G.targetYaw=G.yaw=look;player.rotation.y=G.yaw;
      if(t2>=1){G.state='walk';setHint('Отошли. Теперь точнее целься!');}
    }
    else if(G.state==='fly'){
      animIdle(dt);headG.rotation.y=0;
      /* физика предмета */
      if(it.flying){
        it.vel.y-=9.8*dt;
        it.g.position.addScaledVector(it.vel,dt);
        it.g.rotation.x+=it.spin.x*dt;it.g.rotation.z+=it.spin.z*dt;
        if(it.g.position.y<=it.restY){
          it.g.position.y=it.restY;
          if(Math.abs(it.vel.y)>1.4&&it.bounces<3){
            it.vel.y*=-.32;it.vel.x*=.72;it.vel.z*=.72;it.bounces++;
            burst(it.g.position,SURFS[G.curSurf()].c1,6,1);
            tone(140,60,.08,'triangle',.2);
          }else{
            it.flying=false;it.rolling=true;
            it.vel.y=0;
            const d=SURFS[G.curSurf()].roll;
            it.vel.x*=.55+d*.1;it.vel.z*=.55+d*.1;
            burst(it.g.position,SURFS[G.curSurf()].c1,10,1.4);
          }
        }
      }else if(it.rolling){
        const sp=Math.hypot(it.vel.x,it.vel.z);
        if(sp>.22){
          const dec=(5/SURFS[G.curSurf()].roll)*dt;
          const ns=Math.max(0,sp-dec);
          it.vel.x*=ns/sp;it.vel.z*=ns/sp;
          it.g.position.addScaledVector(it.vel,dt);
          const axis=new THREE.Vector3(-it.vel.z,0,it.vel.x).normalize();
          it.g.rotateOnWorldAxis(axis,-(sp*dt)/.13);
          it.g.position.y=it.restY;
        }else{
          it.rolling=false;settle();
        }
      }
      it.g.position.x=clamp(it.g.position.x,-4,4);
    }
  }

  /* ---- таймер уровня ---- */
  if(G.mode==='level'&&G.lvl.active&&!G.paused&&G.state!=='result'){
    if(G.state!=='fly'&&G.state!=='kick')G.lvl.time-=dt;
    if(G.lvl.time<0){G.lvl.time=0;G.lvl.active=false;endRun();}
    const f=clamp(G.lvl.time/75,0,1);
    $('timeFill').style.width=(f*100)+'%';
    $('timeFill').classList.toggle('low',f<.25);
  }

  /* ---- рециклинг дороги ---- */
  for(const seg of segments){
    if(seg.z>player.position.z+SEG_LEN*1.6){seg.z-=SEG_LEN*SEG_N;seg.grp.position.z=seg.z;regenDecor(seg);}
  }
  roadStripe.position.z=player.position.z-95;

  /* ---- солнце следует за действием ---- */
  const focus=(playing&&G.state==='fly'&&it.g.position.distanceTo(player.position)>8)?it.g.position:player.position;
  sun.position.set(focus.x+18,42,focus.z+14);
  sun.target.position.copy(focus);sun.target.updateMatrixWorld();

  /* ---- камера ---- */
  if(G.state==='menu'){
    const a=t*.18;
    camGoalPos.set(player.position.x+Math.sin(a)*4.6,2.1+Math.sin(t*.3)*.3,player.position.z+Math.cos(a)*4.6);
    camGoalLook.copy(player.position).add(new THREE.Vector3(0,1,0));
  }else if(G.state==='fly'&&G.kickPowerful){
    /* мощный удар — камера разворачивается за предметом */
    const vel=it.vel.clone();vel.y=0;
    if(vel.lengthSq()<.1)vel.subVectors(it.g.position,itemObj.startPos).setY(0);
    if(vel.lengthSq()<.1)vel.set(0,0,-1);
    vel.normalize();
    camGoalPos.copy(it.g.position).addScaledVector(vel,-5.5).add(new THREE.Vector3(0,2.6,0));
    camGoalLook.copy(it.g.position);
  }else if(G.state==='fly'){
    /* обычный полёт — камера у игрока, провожает взглядом */
    const back=new THREE.Vector3(Math.sin(G.yaw),0,Math.cos(G.yaw));
    camGoalPos.copy(player.position).addScaledVector(back,4.4).add(new THREE.Vector3(0,2.9,0));
    camGoalLook.copy(player.position).lerp(it.g.position,.55).add(new THREE.Vector3(0,.7,0));
  }else{
    const back=new THREE.Vector3(Math.sin(G.yaw),0,Math.cos(G.yaw));
    camGoalPos.copy(player.position).addScaledVector(back,4.4).add(new THREE.Vector3(0,2.9,0));
    camGoalLook.copy(player.position).add(new THREE.Vector3(-Math.sin(G.yaw)*3,.9,-Math.cos(G.yaw)*3));
  }
  const ck=(G.state==='fly'&&G.kickPowerful)?4.5:3.2;
  G.camPos.lerp(camGoalPos,Math.min(1,dt*ck));
  G.camLook.lerp(camGoalLook,Math.min(1,dt*ck));
  camera.position.copy(G.camPos);
  /* лёгкий head-bob при ходьбе */
  if(G.state==='walk'&&jlen>.12)camera.position.y+=Math.sin(walkPhase*2)*.03;
  camera.lookAt(G.camLook);

  updDust(dt);updConfetti(dt);
  renderer.render(scene,camera);
}
applySurface(S.s);
requestAnimationFrame(tick);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  cc.width=innerWidth;cc.height=innerHeight;
});
</script>
</body>
</html>
