<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111923">
<title>ПИНОК — смотри под ноги</title>
<style>
:root{
  --yellow:#efff79;
  --cyan:#7affdd;
  --pink:#ff729d;
  --panel:rgba(16,24,34,.94);
  --muted:#b1bdca;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#111923;color:#fff;
  font-family:Inter,Arial,sans-serif;
  touch-action:none;user-select:none;
}
button{font:inherit;border:0;cursor:pointer;color:inherit}
button:disabled{opacity:.38;cursor:default}
canvas{display:block}
#world{position:fixed;inset:0;width:100%;height:100%}
#vignette{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 43%,transparent 43%,#0c172f42);
}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;padding:16px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pill{
  background:var(--panel);border:1px solid #ffffff25;border-radius:17px;
  padding:11px 14px;backdrop-filter:blur(12px);
  box-shadow:0 4px 20px #0002;
}
.money{font-size:23px;font-weight:1000;color:var(--yellow)}
.actions{display:flex;gap:7px;pointer-events:auto}
.actions button{font-weight:900}
.stats{display:flex;gap:7px;margin-top:9px}
.stat{padding:8px 11px;font-size:10px;color:var(--muted)}
.stat b{display:block;font-size:18px;color:white;margin-top:3px}
#goalBox{margin-top:9px;max-width:340px;font-size:12px;font-weight:800}
.goalRow{display:flex;justify-content:space-between;gap:15px}
.rail{height:6px;background:#ffffff24;border-radius:20px;overflow:hidden;margin-top:8px}
.rail i{display:block;width:0;height:100%;background:var(--cyan)}
#message{
  position:absolute;left:50%;top:27%;transform:translateX(-50%);
  width:min(90%,560px);text-align:center;font-size:clamp(22px,4vw,36px);
  font-weight:1000;text-shadow:0 3px 8px #0008;
}
#message small{display:block;font-size:12px;line-height:1.5;margin-top:7px}
#proximity{
  position:absolute;left:50%;bottom:184px;transform:translateX(-50%);
  padding:9px 14px;border-radius:20px;background:#101b28c9;
  border:1px solid #ffffff35;white-space:nowrap;font-size:12px;font-weight:800;
}
#kit{
  position:absolute;left:15px;right:150px;bottom:18px;
  display:flex;flex-wrap:wrap;gap:5px;
}
.tag{padding:6px 8px;border-radius:8px;background:#102032ce;font-size:10px}
#charge{
  position:absolute;left:50%;bottom:123px;transform:translateX(-50%);
  width:min(285px,49vw);opacity:0;transition:opacity .12s;
}
#chargeText{text-align:center;font-size:12px;font-weight:900;margin-bottom:7px;text-shadow:0 2px 5px #000}
.chargeRail{
  position:relative;height:21px;border:2px solid #fff;
  border-radius:20px;background:#101923c9;overflow:hidden;
}
#chargeFill{width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--yellow),var(--pink))}
.sweet{
  position:absolute;left:68%;width:17%;top:0;bottom:0;
  border-left:2px solid white;border-right:2px solid white;background:#fff3;
}
#controls{position:fixed;inset:0;pointer-events:none}
#moveZone{
  position:absolute;left:0;top:25%;bottom:65px;width:69%;
  pointer-events:auto;touch-action:none;
}
#kick{
  position:absolute;right:max(20px,env(safe-area-inset-right));
  bottom:max(27px,env(safe-area-inset-bottom));
  width:119px;height:119px;border-radius:50%;
  background:var(--yellow);color:#142032;border:5px solid white;
  font-weight:1000;font-size:22px;
  box-shadow:0 7px 0 #8f9b39,0 13px 30px #0005;
  pointer-events:auto;touch-action:none;
}
#kick small{display:block;margin-top:5px;font-size:10px;letter-spacing:.8px}
#kick.held{transform:translateY(5px);box-shadow:0 2px 0 #8f9b39,0 0 30px #efff7944}
#kick.wait{filter:grayscale(.8);opacity:.55}
#hint{
  position:absolute;left:22px;bottom:97px;font-size:12px;
  line-height:1.65;text-shadow:0 2px 5px #000;max-width:195px;
}
#joystick{
  position:fixed;display:none;width:110px;height:110px;
  border-radius:50%;border:1px solid #ffffff33;background:#ffffff07;
  transform:translate(-50%,-50%);pointer-events:none;
}
#knob{
  position:absolute;left:39px;top:39px;width:30px;height:30px;
  border:1px solid #ffffffa0;border-radius:50%;background:#ffffff25;
}
#overlay{
  position:fixed;inset:0;z-index:30;display:flex;
  align-items:center;justify-content:center;padding:18px;
  background:#08111bbd;backdrop-filter:blur(13px);
  overflow:auto;touch-action:pan-y;
}
.panel{
  width:min(560px,100%);max-height:94dvh;overflow:auto;touch-action:pan-y;
  padding:25px;border-radius:26px;border:1px solid #ffffff26;
  background:linear-gradient(145deg,#253243,#111b29);
  box-shadow:0 25px 100px #0006;
}
.eyebrow{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:2.5px}
.brand{
  font-size:clamp(54px,12vw,78px);font-weight:1000;letter-spacing:-5px;
  line-height:1;color:var(--yellow);transform:rotate(-4deg);
  text-shadow:4px 5px 0 #e56893,7px 9px 0 #0003;margin:15px 0 28px;
}
h2{margin:13px 0;font-size:29px;letter-spacing:-.8px}
p{font-size:14px;line-height:1.6;color:#c3cedd}
.hero{font-size:17px;color:white;font-weight:700}
.primary,.secondary{
  display:block;width:100%;padding:15px;border-radius:15px;
  font-size:15px;font-weight:900;margin-top:12px;
}
.primary{background:var(--yellow);color:#172334;box-shadow:0 4px 0 #8e9a37}
.primary.pink{background:var(--pink);color:#241b2a;box-shadow:0 4px 0 #a14363}
.secondary{border:1px solid #ffffff27;background:#ffffff09}
.tip{
  border-radius:14px;padding:13px;background:#ffffff07;
  color:#b8c7da;font-size:12px;line-height:1.75;margin:17px 0;
}
.row{display:flex;justify-content:space-between;align-items:center;gap:9px}
.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.mini{padding:13px 7px;text-align:center;background:#ffffff08;border-radius:14px;font-size:11px;color:var(--muted)}
.mini b{display:block;color:white;font-size:22px;margin-bottom:5px}
.tabs{display:flex;gap:7px;margin:15px 0}
.tabs button{flex:1;border-radius:11px;padding:11px 5px;background:#ffffff09;font-size:12px;font-weight:900}
.tabs button.active{background:var(--cyan);color:#182532}
.item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:13px;background:#ffffff06;margin:7px 0;border:1px solid transparent}
.item.current{border-color:var(--cyan);background:#7affdd0c}
.num{min-width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:#ffffff0c;color:var(--yellow);font-weight:900}
.info{flex:1}
.info b{font-size:13px}
.info small{display:block;margin-top:5px;font-size:10px;color:var(--muted)}
.buy{padding:10px;border-radius:9px;background:var(--yellow);color:#172334;font-size:12px;font-weight:900}
footer{margin-top:17px;text-align:center;color:#8394a9;font-size:10px;line-height:1.5}
.float{
  position:fixed;top:43%;left:50%;z-index:15;pointer-events:none;
  font-size:27px;font-weight:1000;text-shadow:0 3px 3px #142034;
  white-space:nowrap;animation:floatUp 1.2s ease-out forwards;
}
@keyframes floatUp{
  from{opacity:1;transform:translate(-50%,0) scale(.9)}
  to{opacity:0;transform:translate(-50%,-100px) scale(1.08)}
}
#loading{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding:25px;background:#111923;text-align:center;
  color:var(--yellow);font-weight:900;
}
#loading small{display:block;color:#a8b8cc;font-weight:400;line-height:1.7;margin-top:13px}
@media(max-height:600px){
  #kit{display:none}
  #proximity{bottom:130px}
  #charge{bottom:77px}
  #kick{width:99px;height:99px;font-size:19px}
  #hint{bottom:55px}
  #message{top:24%}
  .panel{padding:20px}
}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="vignette"></div>

<div id="hud" class="hidden">
  <div class="top">
    <div class="pill money">🪙 <span id="coins">0</span></div>
    <div class="actions">
      <button id="shopButton" class="pill">⚡ БИЛД</button>
      <button id="pauseButton" class="pill" aria-label="Пауза">Ⅱ</button>
    </div>
  </div>
  <div class="stats">
    <div class="pill stat">ПУТЬ ПРЕДМЕТА<b id="meters">0 м</b></div>
    <div class="pill stat">ОЧКИ<b id="points">0</b></div>
    <div class="pill stat">ВРЕМЯ<b id="time">∞</b></div>
  </div>
  <div id="goalBox" class="pill hidden">
    <div class="goalRow"><span id="levelText"></span><span id="goalText"></span></div>
    <div class="rail"><i id="goalFill"></i></div>
  </div>
  <div id="message"></div>
  <div id="proximity">Ты идёшь автоматически</div>
  <div id="charge">
    <div id="chargeText">ЗАМАХ НА ПОДХОДЕ</div>
    <div class="chargeRail">
      <div id="chargeFill"></div>
      <div class="sweet"></div>
    </div>
  </div>
  <div id="kit"></div>
</div>

<div id="controls" class="hidden">
  <div id="moveZone"></div>
  <div id="hint">↔ Потяни слева — сместись<br>↑ Вперёд идёшь автоматически</div>
  <button id="kick">ПИНОК<small>ЗАЖМИ → ОТПУСТИ</small></button>
  <div id="joystick"><div id="knob"></div></div>
</div>

<div id="overlay"><div class="panel" id="panel"></div></div>
<div id="loading"><div>ВЫРАЩИВАЕМ ТРАВУ…<small>Создаём персонажа, материалы и солнечный свет.</small></div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

const $=id=>document.getElementById(id);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=THREE.MathUtils.clamp;
const mix=THREE.MathUtils.lerp;
const smooth=(a,b,x)=>THREE.MathUtils.smoothstep(x,a,b);
const fmt=n=>Math.floor(n).toLocaleString('ru-RU');
const mobile=matchMedia('(pointer:coarse)').matches;
const reducedMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;

const LEGS=[
 ['Голая кость',0],
 ['Сухожилия',45],
 ['Первая мышца',100],
 ['Живая нога',190],
 ['Нога атлета',330],
 ['Рваные штаны',550],
 ['Дворовый спортсмен',900],
 ['Новые кроссовки',1450],
 ['Уличная легенда',2250],
 ['Профессионал',3400],
 ['Карбон PRO',5100],
 ['Люкс-костюм',7500],
 ['Золотая бутса',10800],
 ['Алмазная нога',15500],
 ['КЛЮШКА АБСОЛЮТА',22500]
];
const ITEMS=[
 ['Худенькая веточка',0,.65],
 ['Палочка',55,.75],
 ['Камушек',140,.85],
 ['Старый телефон',310,.95],
 ['Алюминиевая банка',650,1.02],
 ['Мяч для гольфа',1250,1.10],
 ['Теннисный мяч',2350,1.18],
 ['Бильярдный шар',4300,1.27],
 ['Стальной диск',7600,1.36],
 ['ХОККЕЙНАЯ ШАЙБА',13500,1.48]
];
const SURFACES=[
 ['Трава',0,1.85,0x667744,'grass'],
 ['Песок',50,1.60,0xc8b286,'sand'],
 ['Асфальт',115,1.36,0x51585a,'asphalt'],
 ['Бетон',215,1.17,0x9c9f99,'concrete'],
 ['Плитка',380,1.02,0xa8978a,'tile'],
 ['Спортивная резина',640,.90,0x597d7a,'rubber'],
 ['Деревянный настил',1050,.78,0x9d7750,'wood'],
 ['Паркет',1650,.67,0xb18b5e,'wood'],
 ['Лакированное дерево',2550,.57,0x88613c,'wood'],
 ['Терраццо',3900,.49,0x9da6a6,'terrazzo'],
 ['Мрамор',5750,.41,0xbdc8c7,'marble'],
 ['Полированный мрамор',8350,.34,0xd5dfda,'marble'],
 ['Гладкий металл',11900,.28,0x92a6b0,'metal'],
 ['Синтетический лёд',16800,.22,0xb9dadf,'ice'],
 ['ЛЁД',24000,.15,0xc4e5e8,'ice']
];
const TABLES=[LEGS,ITEMS,SURFACES];
const SAVE_KEY='pinok-real-road-v1';
let save={coins:0,up:[0,0,0],level:1,best:0,sound:true,quality:mobile?1:2};

try{
 const data=JSON.parse(localStorage.getItem(SAVE_KEY));
 if(data){
  save.coins=Math.max(0,Math.floor(Number(data.coins)||0));
  save.up=TABLES.map((t,i)=>clamp(Math.floor(Number(data.up?.[i])||0),0,t.length-1));
  save.level=Math.max(1,Math.floor(Number(data.level)||1));
  save.best=Math.max(0,Number(data.best)||0);
  save.sound=data.sound!==false;
  save.quality=data.quality===1?1:2;
 }
}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

let audio;
function unlockAudio(){
 if(!save.sound)return;
 try{
  audio ||= new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
 }catch(e){}
}
function tone(f=160,d=.12,type='sine',volume=.05,end=.5){
 if(!save.sound||!audio)return;
 const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;
 o.type=type;o.frequency.setValueAtTime(f,t);
 o.frequency.exponentialRampToValueAtTime(Math.max(20,f*end),t+d);
 g.gain.setValueAtTime(volume,t);
 g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d);
}
function noise(volume=.02,d=.075){
 if(!save.sound||!audio)return;
 const count=Math.floor(audio.sampleRate*d);
 const buffer=audio.createBuffer(1,count,audio.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<count;i++)data[i]=(Math.random()*2-1)*(1-i/count);
 const source=audio.createBufferSource(),gain=audio.createGain();
 const filter=audio.createBiquadFilter();
 filter.type='lowpass';filter.frequency.value=activeUp[2]===0?800:1900;
 source.buffer=buffer;gain.gain.value=volume;
 source.connect(filter);filter.connect(gain);gain.connect(audio.destination);source.start();
}
function cheer(){
 [392,494,587,784].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.05,1),110*i));
}

let renderer;
try{
 renderer=new THREE.WebGLRenderer({
  canvas:$('world'),antialias:true,powerPreference:'high-performance'
 });
}catch(e){
 $('loading').innerHTML='<div>WebGL недоступен.<small>Открой игру в современном браузере с аппаратным ускорением.</small></div>';
 throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,save.quality===1?1.15:1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb8cdd7);
scene.fog=new THREE.FogExp2(0xb8cdd7,.011);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.035,350);
camera.position.set(0,1.68,.14);

scene.add(new THREE.HemisphereLight(0xddeaff,0x757455,1.5));
const sun=new THREE.DirectionalLight(0xffe2b6,3.5);
sun.castShadow=true;
sun.shadow.mapSize.set(save.quality===1?1536:2048,save.quality===1?1536:2048);
Object.assign(sun.shadow.camera,{
 left:-11,right:11,top:14,bottom:-14,near:1,far:75
});
sun.shadow.bias=-.00012;
sun.shadow.normalBias=.018;
sun.shadow.radius=2;
scene.add(sun,sun.target);

const skyMaterial=new THREE.ShaderMaterial({
 side:THREE.BackSide,
 uniforms:{sunDir:{value:V(-.4,.68,.43).normalize()}},
 vertexShader:`
 varying vec3 direction;
 void main(){
  direction=position;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
 }`,
 fragmentShader:`
 varying vec3 direction;
 uniform vec3 sunDir;
 void main(){
  vec3 d=normalize(direction);
  float h=max(d.y,0.0);
  vec3 col=mix(vec3(.78,.84,.86),vec3(.21,.42,.64),pow(h,.45));
  col=mix(vec3(.28,.31,.22),col,smoothstep(-.04,.08,d.y));
  float s=max(0.0,dot(d,sunDir));
  col+=vec3(1.0,.7,.36)*pow(s,25.0)*.32;
  col+=vec3(7.0,5.0,2.8)*pow(s,1700.0);
  gl_FragColor=vec4(col,1.0);
 }`
});
const envScene=new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100,32,16),skyMaterial));
const pmrem=new THREE.PMREMGenerator(renderer);
const environment=pmrem.fromScene(envScene,.045);
scene.environment=environment.texture;
pmrem.dispose();
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,32,16),skyMaterial);
scene.add(sky);

const materialCache=new Map();
function material(color,rough=.7,metal=0){
 const key=[color,rough,metal].join('/');
 if(!materialCache.has(key)){
  materialCache.set(key,new THREE.MeshStandardMaterial({
   color,roughness:rough,metalness:metal
  }));
 }
 return materialCache.get(key);
}
function mesh(geo,mat,parent,pos){
 const m=new THREE.Mesh(geo,mat);
 m.castShadow=true;m.receiveShadow=true;
 if(pos)m.position.copy(pos);
 if(parent)parent.add(m);
 return m;
}
function box(w,h,d,mat,parent,pos){
 return mesh(new THREE.BoxGeometry(w,h,d),mat,parent,pos);
}
function ellipsoid(x,y,z,mat,parent,pos){
 const o=mesh(new THREE.SphereGeometry(1,24,16),mat,parent,pos);
 o.scale.set(x,y,z);return o;
}
function capsule(r,length,mat,parent,pos){
 return mesh(new THREE.CapsuleGeometry(r,length,7,14),mat,parent,pos);
}
function rod(a,b,rA,rB,mat,parent){
 const delta=b.clone().sub(a);
 const o=mesh(new THREE.CylinderGeometry(rB,rA,delta.length(),12),mat,parent,
  a.clone().add(b).multiplyScalar(.5));
 o.quaternion.setFromUnitVectors(V(0,1,0),delta.normalize());
 return o;
}
function curveTube(points,radius,mat,parent){
 const curve=new THREE.CatmullRomCurve3(points);
 return mesh(new THREE.TubeGeometry(curve,Math.max(12,points.length*5),radius,6,false),mat,parent);
}
function clearModel(group){
 group.traverse(o=>{if(o.isMesh)o.geometry.dispose()});
 group.clear();
}

// Все текстуры генерируются локально.
const textureCache=new Map();
function texture(kind,color){
 const key=kind+color;
 if(textureCache.has(key))return textureCache.get(key);
 const canvas=document.createElement('canvas');
 canvas.width=canvas.height=512;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#'+new THREE.Color(color).getHexString();
 ctx.fillRect(0,0,512,512);
 let seed=29;
 const rand=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};

 for(let i=0;i<32000;i++){
  const a=rand()*(kind==='skin'?.075:.18);
  ctx.fillStyle=rand()>.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`;
  const n=kind==='skin'?.6+rand():1+rand()*2;
  ctx.fillRect(rand()*512,rand()*512,n,n);
 }
 if(kind==='skin'){
  for(let i=0;i<110;i++){
   ctx.fillStyle=`rgba(93,51,31,${.035+rand()*.045})`;
   ctx.beginPath();
   ctx.ellipse(rand()*512,rand()*512,1+rand()*2,1+rand(),rand()*6,0,7);
   ctx.fill();
  }
 }
 if(kind==='grass'){
  for(let i=0;i<12500;i++){
   const x=rand()*512,y=rand()*512;
   ctx.strokeStyle=['#adab6455','#2e492966','#87954c66'][i%3];
   ctx.lineWidth=.5+rand();
   ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+rand()*5-2,y-3-rand()*10);ctx.stroke();
  }
 }
 if(kind==='cloth'){
  for(let i=0;i<512;i+=3){
   ctx.fillStyle='#ffffff0a';ctx.fillRect(i,0,1,512);
   ctx.fillStyle='#00000012';ctx.fillRect(0,i,512,1);
  }
 }
 if(kind==='wood'||kind==='bark'||kind==='bone'){
  for(let i=0;i<280;i++){
   let x=rand()*512;
   ctx.strokeStyle=`rgba(35,20,10,${.025+rand()*.14})`;
   ctx.lineWidth=kind==='bark'?1+rand()*3:.6;
   ctx.beginPath();ctx.moveTo(x,0);
   ctx.bezierCurveTo(x+rand()*20,160,x-rand()*20,360,x,512);ctx.stroke();
  }
  if(kind==='wood'){
   ctx.strokeStyle='#33200f55';ctx.lineWidth=2;
   for(let x=0;x<512;x+=64){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,512);ctx.stroke();
   }

function seeded(seed){
 return ()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
}
function levelSpec(n){
 const random=seeded(n*9973+23);
 const up=[Math.floor(random()*15),Math.floor(random()*10),Math.floor(random()*15)];
 const duration=70+Math.min(20,Math.floor(n/5)*5);
 const v=(5.5+up[0]*.74)*ITEMS[up[1]][2]*.86;
 const d=SURFACES[up[2]][2]/(1+up[1]*.045);
 const distance=v/d-.55/(d*d)*Math.log(1+d*v/.55);
 const flight=Math.log(1+d*v/.55)/d;
 const cycle=2.5+flight+distance/7;
 const multiplier=1+up[0]*.24+up[1]*.42+up[2]*.22;
 const target=Math.max(30,Math.round((duration/cycle)*(distance+2)*multiplier*
  (.36+Math.min(n,30)*.009)/5)*5);
 return {n,up,duration,goal:target};
}

 }

 // Направление идёт от реального положения тела к предмету.
 // Никакого независимого поворота направления джойстиком.
 const angle=clamp(Math.atan2(dx,Math.max(.35,dz)),-.93,.93);
 const strength=(.2+.8*shot.charge)*(shot.perfect?1.2:shot.strong?1.34:1);
 const speed=power()*ITEMS[activeUp[1]][2]*strength;
 velocity.set(Math.sin(angle)*speed,0,-Math.cos(angle)*speed);
 verticalVelocity=shot.strong?1.10+speed*.035:shot.perfect?.42:.16;
 shotMultiplier=shot.perfect?1.65:shot.strong?.92:1;
 reward(2*income()*shotMultiplier);
 lookFlight=true;shake=reducedMotion?0:(shot.strong?.025:.011);
 burst(objectPos,shot.perfect?30:18);
 tone(activeUp[1]>=8?105:165,.11,'triangle',.065,.27);noise(.03,.06);
 if(shot.perfect){
  perfectCount++;floating('В ТЕМП! ×1.65','var(--cyan)');
  say('ВОТ ЭТО ТАЙМИНГ!','Удар на ходу · идеальный заряд','var(--cyan)',1.6);
  tone(690,.10,'triangle',.027,1.3);
 }else if(shot.strong){
  say('ВОТ ЭТО УЛЕТЕЛО!','Поднимаем взгляд за предметом','var(--yellow)',1.6);
 }else{
  say('ХОРОШИЙ ПИНОК!',Math.abs(dx)>.15?
   (dx>0?'Подошёл слева → отправил вправо':'Подошёл справа → отправил влево'):
   'Почти по центру — прямо вперёд','white',1.2);
 }

}
function updatePhysics(dt){
 const speed=velocity.length();
 if(speed>.02){
  const oldX=objectPos.x,oldZ=objectPos.z;
  const d=drag();
  const nextSpeed=Math.max(0,(speed+.55/d)*Math.exp(-d*dt)-.55/d);
  velocity.multiplyScalar(nextSpeed/speed);
  objectPos.addScaledVector(velocity,dt);
  if(Math.abs(objectPos.x)>4.75){
   objectPos.x=clamp(objectPos.x,-4.75,4.75);
   velocity.x*=-.42;burst(objectPos,6);tone(220,.05,'triangle',.017,.6);
  }
  const traveled=Math.hypot(objectPos.x-oldX,objectPos.z-oldZ);
  runDistance+=traveled;reward(traveled*income()*shotMultiplier);
  const rolling=activeUp[1]===2||(activeUp[1]>=4&&activeUp[1]<=7);
  if(rolling){
   objectVisual.rotation.x-=traveled/Math.max(.07,objectRadius);
   objectVisual.rotation.z-=velocity.x*dt/Math.max(.08,objectRadius);
  }else objectVisual.rotation.y+=nextSpeed*dt*(activeUp[1]<2?.75:.18);
 }else velocity.set(0,0,0);
 if(objectPos.y>objectRadius||verticalVelocity>0){
  verticalVelocity-=9.81*dt;objectPos.y+=verticalVelocity*dt;
  if(objectPos.y<=objectRadius){
   objectPos.y=objectRadius;
   verticalVelocity=Math.abs(verticalVelocity)>1.1?
    -verticalVelocity*(activeUp[1]===6?.48:.17):0;
  }
 }
}
function updateGame(dt){
 elapsed+=dt;phaseTime+=dt;
 if(mode==='level')timer-=dt;
 const keyboard=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);
 const axis=keyboard||moveAxis;
 lateralVelocity=mix(lateralVelocity,axis*2.1,1-Math.exp(-dt*9));
 player.x=clamp(player.x+lateralVelocity*dt,-4.72,4.72);

 if(phase==='back'){
  const t=clamp(phaseTime/.95,0,1);
  player.z=retreatStart+2*(t*t*(3-2*t));
  forwardSpeed=-2;
  walkCycle+=dt*8;
  if(t>=1){
   phase='walk';phaseTime=0;forwardSpeed=1.15;
   say('ЕЩЁ ОДНА ПОПЫТКА','Ты снова идёшь. Заряди удар на подходе.','white',1.7);
  }
 }else{
  const distance=gap();
  // Персонаж никогда не останавливается перед предметом.
  // Далеко — догоняет бегом. Рядом — сохраняет шаг.
  const targetSpeed=distance>3?clamp(1.15+(distance-3)*.9,1.15,7.5):1.15;
  forwardSpeed=mix(forwardSpeed,targetSpeed,1-Math.exp(-dt*5));
  player.z-=forwardSpeed*dt;
  walkCycle+=dt*(6.5+forwardSpeed*1.0);
 }

 if(held){
  holdTime+=dt;chargeValue=Math.min(1,holdTime/1.2);
  $('chargeFill').style.width=chargeValue*100+'%';
  const perfect=chargeValue>=.68&&chargeValue<=.85;
  $('chargeText').textContent=perfect?'БЕЛАЯ ЗОНА! ЛОВИ ДИСТАНЦИЮ':
   chargeValue>.94?'ПЕРЕЗАРЯД · ДАЛЬНИЙ ПОЛЁТ':'ЗАМАХ '+Math.floor(chargeValue*100)+'%';
  $('chargeText').style.color=perfect?'var(--cyan)':chargeValue>.94?'var(--pink)':'white';
 }
 if(phase==='swing'){
  if(phaseTime>=.19&&!impactDone)applyImpact();
  if(phaseTime>.57){
   if(pendingBack)beginRetreat();
   else{phase='walk';phaseTime=0;chargeValue=0}

 }
 updatePhysics(dt);

 // Если прошли предмет без удара, не зависаем и не шагаем на месте.
 if(phase==='walk'&&gap()<-.23){
  say('ПРЕДМЕТ ОСТАЛСЯ ПОЗАДИ','Отходим на два метра. В следующий раз отпусти раньше.','var(--pink)',2.4);
  beginRetreat();
 }

 const step=Math.floor(walkCycle/Math.PI);
 if(step!==lastStep){
  lastStep=step;noise(phase==='back'?.014:.019,.065);
  tone(activeUp[2]===0?70:95,.035,'triangle',.011,.6);
 }
 if(messageTime>0){
  messageTime-=dt;if(messageTime<=0)$('message').style.opacity=0;
 }
 shake=Math.max(0,shake-dt*.06);
 const horizontal=objectPos.x-player.x;
 const distance=gap();
 let text='↑ ИДЁШЬ ВПЕРЁД';
 let color='white';
 if(phase==='back'){text='↩ АВТООТХОД · 2 МЕТРА';color='var(--pink)'}
 else if(phase==='swing')text='👟 УДАР НА ХОДУ';
 else if(Math.abs(horizontal)>.65){
  text=(horizontal>0?'СМЕСТИСЬ ВПРАВО →':'← СМЕСТИСЬ ВЛЕВО')+' · '+Math.abs(horizontal).toFixed(1)+' м';
  color='var(--yellow)';
 }else if(reachable()){
  text=held?'ОТПУСКАЙ — ПРЕДМЕТ РЯДОМ!':'ПРЕДМЕТ РЯДОМ · БЕЙ!';
  color='var(--cyan)';
 }else if(distance>1){
  const seconds=Math.max(0,(distance-.8)/Math.max(1.15,forwardSpeed));

   '↑ ДОГОНЯЕШЬ · '+distance.toFixed(1)+' м';
 }else text='МИМО НЕ ПРОЙДЁМ — ЛОВИ МОМЕНТ';
 $('proximity').textContent=text;$('proximity').style.color=color;

 updateHUD();

 if(mode==='level'){

 }

 // Плавающее начало координат для бесконечного забега.
 if(player.z<-1200){

}

// Двухзвенная IK ног: стопы не просто болтаются на одной оси.
function solveLeg(rig,y,z,toePitch=0){
 const l1=.46,l2=.47;
 const r=clamp(Math.hypot(y,z),.12,l1+l2-.001);
 const direction=Math.atan2(-z,-y);
 const a=Math.acos(clamp((l1*l1+r*r-l2*l2)/(2*l1*r),-1,1));
 const knee=-(Math.PI-Math.acos(clamp((l1*l1+l2*l2-r*r)/(2*l1*l2),-1,1)));
 rig.thigh.rotation.x=direction+a;
 rig.shin.rotation.x=knee;
 rig.foot.rotation.x=-(rig.thigh.rotation.x+knee)+toePitch;
}
function updateCharacter(){
 const moving=playing;
 const bob=reducedMotion?0:Math.sin(walkCycle*2)*.012;
 const strike=phase==='swing';
 character.position.copy(player);
 character.rotation.z=-lateralVelocity*.018;
 const hipHeight=.94+bob-(strike?.025:0);

 for(const rig of legs){
  rig.root.position.set(rig.side*.115,hipHeight,0);
  const p=walkCycle+(rig.side===1?0:Math.PI);
  const s=Math.sin(p),lift=Math.max(0,Math.cos(p));
  let footZ=moving?s*.245:-.055;
  let footY=.058+(moving?lift*.075:0);
  let toe=moving?Math.max(0,-s)*.12:0;
  const selected=rig.side===kickingSide;

  if(held&&selected){
   const t=smooth(0,.45,chargeValue);
   footZ=mix(footZ,.20+chargeValue*.09,t);
   footY=mix(footY,.16+chargeValue*.10,t);
   toe=mix(toe,.18,t);
  }
  if(strike&&selected){
   const t=phaseTime;
   if(t<.19){
    const u=smooth(0,.19,t);
    footZ=mix(.30,-.57,u);
    footY=mix(.22,shot?.overhead?.60:.12,u);
    toe=mix(.15,-.10,u);
   }else{
    const u=smooth(.19,.57,t);
    footZ=mix(-.57,footZ,u);
    footY=mix(shot?.overhead?.60:.12,footY,u);
    toe=mix(-.1,toe,u);
   }
  }
  if(rig.club){
   let angle=.08+s*.12;
   if(held)angle=-.40*chargeValue;
   if(strike){
    angle=phaseTime<.19?mix(-.40,shot?.overhead?1.05:.64,smooth(0,.19,phaseTime)):
     mix(shot?.overhead?1.05:.64,.08,smooth(.19,.57,phaseTime));
   }
   rig.thigh.rotation.x=angle;
  }else solveLeg(rig,footY-hipHeight,footZ,toe);
  rig.root.rotation.y=selected&&strike?
   -clamp((objectPos.x-player.x)*.45,-.35,.35):0;
 }
 for(const arm of arms){
  const p=walkCycle+(arm.side===1?Math.PI:0);
  arm.upper.rotation.x=.11+Math.sin(p)*.19;
  arm.upper.rotation.z=arm.side*.12+lateralVelocity*.035;
  arm.elbow.rotation.x=.38+Math.max(0,-Math.sin(p))*.12;
  arm.hand.rotation.x=-.17;
  arm.hand.rotation.y=arm.side*.16;
  arm.hand.rotation.z=arm.side*.08;
  if(held||strike){
   const balance=held?chargeValue:1-smooth(.19,.57,phaseTime);
   arm.upper.rotation.x+=balance*.09;
   arm.upper.rotation.z+=arm.side*balance*.12;
   arm.elbow.rotation.x+=balance*.14;
  }
 }
 character.updateMatrixWorld(true);
 for(let i=0;i<legs.length;i++){
  const rig=legs[i];
  rig.foot.getWorldPosition(footWorld);
  const shadow=footContacts[i];
  shadow.position.set(footWorld.x,.010,footWorld.z-.06);
  shadow.material.opacity=rig.club?0:clamp(.5-footWorld.y*.8,.08,.45);
 }
 bodyContact.position.set(player.x,.009,player.z-.04);
}

 const center=Math.round(player.z/CHUNK)*CHUNK;
 chunks.forEach((c,i)=>c.group.position.z=center+(i-5)*CHUNK);
 mountains.position.z=player.z;sky.position.copy(camera.position);

 sun.position.set(player.x-13,22,player.z+12);
 sun.target.position.set(player.x,0,player.z-4);

 objectContact.position.set(objectPos.x,.011,objectPos.z);
 objectContact.material.opacity=clamp(.75-objectPos.y*.65,.06,.72);
 objectContact.scale.setScalar(1+objectPos.y*.5);
 const near=gap()>-.2&&gap()<3.4;
 marker.visible=playing&&near;
 marker.position.set(objectPos.x,.018,objectPos.z);
 marker.material.color.set(reachable()?0x8effcc:0xecebd3);
 marker.material.opacity=reachable()?.63:.25;
 directionArrow.visible=playing&&phase==='walk'&&gap()<1.65&&gap()>.2;
 if(directionArrow.visible){

  directionArrow.position.set(objectPos.x,.038,objectPos.z);

 }

 // Обычный взгляд: круто вниз, на руки, стопы и точку удара.
 // Подъём допустим только после успешного удара при полёте вперёд.
 const flight=lookFlight&&velocity.length()>1.0&&gap()>2.8;
 const desiredLift=flight?1:0;
 cameraLift=mix(cameraLift,desiredLift,1-Math.exp(-dt*3.8));
 if(!flight&&velocity.length()<.2)lookFlight=false;
 const headBob=reducedMotion?0:Math.sin(walkCycle*2)*.009;
 cameraTarget.set(player.x,1.68+headBob,player.z+.14);
 camera.position.lerp(cameraTarget,1-Math.exp(-dt*13));
 const down=V(player.x+lateralVelocity*.024,.14,player.z-.60);
 const follow=objectPos.clone().add(V(0,.055,0));
 gazeTarget.lerpVectors(down,follow,cameraLift);
 gaze.lerp(gazeTarget,1-Math.exp(-dt*10));
 camera.lookAt(gaze);
 if(!reducedMotion){
  camera.rotation.z+=-lateralVelocity*.008+(Math.random()-.5)*shake;
 }
}

/* ============================================================
   ПИНОК — обновление: камера вниз, полноценная тень,
   пространственная походка и безопасный повторный подход.
   Вставлять ПЕРЕД:
   let previous=performance.now(),saveClock=0;
   ============================================================ */

const POV_UPDATE = {
  startDistance: 3.85,
  startOffsetMin: .90,
  startOffsetMax: 1.27,

  retreatMin: 4.6,
  retryGap: 3.8,
  retreatSpeed: 2.15,

  walkSpeed: 1.08,
  runSpeed: 6.4,

  impactTime: .23,
  swingDuration: .72,

  // Меньше значение — взгляд ближе к вертикальному.
  downLookDistance: .38
};

const pov = {
  distanceWalked: 0,
  oldPlayer: V(),
  retreatFrom: 0,
  retreatTo: 0,
  retreatDuration: 2.2,

  lookHold: 0,
  lastShotDirection: V(0, 0, -1),
  aimPoint: V(),

  footState: [
    { planted: false, x: 0, z: 0 },
    { planted: false, x: 0, z: 0 }
  ],

  shadowParts: null,
  shadowMaterials: new Map(),
  shadowsNeedRebuild: true,
  lastMotionSign: 1,
  strideLength: .66,
  uiClock: 0
};

function povEase(t) {
  t = clamp(t, 0, 1);
  return t * t * (3 - 2 * t);
}

function povDamp(current, target, rate, dt) {
  return mix(current, target, 1 - Math.exp(-rate * dt));
}

/*
  Материал невидим в основном изображении, но геометрия
  продолжает участвовать в построении солнечной карты теней.

  visible=false здесь использовать нельзя:
  это убрало бы и тень.
*/
function povShadowOnlyMaterial(original) {
  if (!pov.shadowMaterials.has(original)) {
    const copy = original.clone();
    copy.colorWrite = false;
    copy.depthWrite = false;
    copy.transparent = false;
    copy.opacity = 1;
    copy.visible = true;
    pov.shadowMaterials.set(original, copy);
  }

  return pov.shadowMaterials.get(original);
}

function povMakeShadowOnly(group) {
  group.traverse(o => {
    if (!o.isMesh) return;

    o.castShadow = true;
    o.receiveShadow = false;

    if (Array.isArray(o.material)) {
      o.material = o.material.map(povShadowOnlyMaterial);
    } else {
      o.material = povShadowOnlyMaterial(o.material);
    }
  });
}

/*
  Отдельные плечи, грудная клетка, таз, шея и голова.
  Они связаны с тем же корнем, что и ноги с руками.
*/
function povBuildShadowBody() {
  const root = new THREE.Group();
  character.add(root);

  const bodyMaterial = material(0x66594e, .9);

  const pelvis = ellipsoid(
    .195, .15, .125,
    bodyMaterial, root, V(0, .96, .025)
  );

  const abdomen = ellipsoid(
    .17, .20, .115,
    bodyMaterial, root, V(0, 1.13, .032)
  );

  const chest = ellipsoid(
    .225, .225, .13,
    bodyMaterial, root, V(0, 1.33, .034)
  );

  rod(
    V(-.29, 1.40, .025),
    V(.29, 1.40, .025),
    .076, .076,
    bodyMaterial, root
  );

  const neck = capsule(
    .056, .105,
    bodyMaterial, root, V(0, 1.545, .029)
  );

  const head = ellipsoid(
    .096, .126, .104,
    bodyMaterial, root, V(0, 1.69, .018)
  );

  // Небольшой выступ лица делает профиль тени менее манекенным.
  ellipsoid(
    .028, .042, .036,
    bodyMaterial, head, V(0, -.035, -.86)
  );

  povMakeShadowOnly(root);

  // Руки сохраняют все суставы и анимацию, но исчезают из кадра.
  arms.forEach(arm => povMakeShadowOnly(arm.shoulder));

  pov.shadowParts = {
    root, pelvis, abdomen, chest, neck, head
  };

  pov.shadowsNeedRebuild = false;
}

const povOriginalBuildCharacter = buildCharacter;

buildCharacter = function(index) {
  povOriginalBuildCharacter(index);
  povBuildShadowBody();

  pov.footState.forEach(f => {
    f.planted = false;
  });
};

/*
  Старт не по центру.
  Смещение больше допустимой боковой дистанции удара:
  стоя на стартовой линии, попасть без движения не получится.
*/
function povPlaceStartingObject() {
  const side = Math.random() < .5 ? -1 : 1;
  const amount = mix(
    POV_UPDATE.startOffsetMin,
    POV_UPDATE.startOffsetMax,
    Math.random()
  );

  objectPos.set(
    player.x + side * amount,
    objectRadius,
    player.z - POV_UPDATE.startDistance
  );

  objectVisual.rotation.set(
    0,
    activeUp[1] < 2 ? (Math.random() - .5) * .65 : 0,
    0
  );

  velocity.set(0, 0, 0);
  verticalVelocity = 0;

  pov.distanceWalked = 0;
  pov.lookHold = 0;
  pov.lastMotionSign = 1;
  pov.strideLength = .66;
  pov.oldPlayer.copy(player);

  pov.footState.forEach(f => {
    f.planted = false;
  });

  forwardSpeed = POV_UPDATE.walkSpeed;
  cameraLift = 0;
  lookFlight = false;

  camera.position.set(
    player.x,
    1.665,
    player.z + .055
  );

  gaze.set(
    player.x,
    .07,
    player.z - POV_UPDATE.downLookDistance
  );

  camera.lookAt(gaze);
}

const povOriginalStartRun = startRun;

startRun = function(newMode, level = null) {
  povOriginalStartRun(newMode, level);
  povPlaceStartingObject();

  say(
    'ПРЕДМЕТ СБОКУ',
    objectPos.x > player.x
      ? 'Сместись вправо. Заряжай удар ещё на подходе.'
      : 'Сместись влево. Заряжай удар ещё на подходе.',
    'var(--yellow)',
    3.3
  );
};

const povOriginalHome = home;

home = function() {
  povOriginalHome();
  povPlaceStartingObject();
};

/*
  На начало удара фиксируем пространственную цель для ноги.
  Физическое попадание всё равно проверяется в момент контакта,
  а не в момент отпускания кнопки.
*/
const povOriginalReleaseCharge = releaseCharge;

releaseCharge = function() {
  const wasHeld = held;
  povOriginalReleaseCharge();

  if (wasHeld && phase === 'swing' && shot) {
    const flightPrediction = velocity
      .clone()
      .multiplyScalar(POV_UPDATE.impactTime);

    pov.aimPoint
      .copy(objectPos)
      .add(flightPrediction);

    shot.contactPoint = pov.aimPoint.clone();
    shot.side = kickingSide;
  }
};

/*
  Камера получает направление только после реального попадания.
*/
const povOriginalApplyImpact = applyImpact;

applyImpact = function() {
  povOriginalApplyImpact();

  if (!pendingBack && velocity.length() > .05) {
    pov.lastShotDirection
      .copy(velocity)
      .setY(0)
      .normalize();

    pov.lookHold = shot?.strong ? 1.55 : .75;

    // Убираем резкий случайный толчок камеры.
    shake = reducedMotion ? 0 : .007;
  }
};

/*
  После промаха игрок отходит не просто на фиксированное число
  метров, а ещё и получает достаточную дистанцию нового подхода.

  Это важно, если предмет уже оказался позади персонажа.
*/
beginRetreat = function() {
  phase = 'back';
  phaseTime = 0;

  held = false;
  holdTime = 0;
  chargeValue = 0;

  $('charge').style.opacity = 0;
  $('kick').classList.remove('held');

  pov.retreatFrom = player.z;

  pov.retreatTo = Math.max(
    player.z + POV_UPDATE.retreatMin,
    objectPos.z + POV_UPDATE.retryGap
  );

  const distance = pov.retreatTo - pov.retreatFrom;

  pov.retreatDuration = Math.max(
    1.9,
    distance / POV_UPDATE.retreatSpeed
  );

  pov.footState.forEach(f => {
    f.planted = false;
  });

  lookFlight = false;
  pov.lookHold = 0;
  pendingBack = false;
  missCount++;

  persist();
};

/*
  Предсказание попадания учитывает время фактического контакта.
*/
reachable = function(predicted = true) {
  const t = predicted ? POV_UPDATE.impactTime : 0;

  const futureObjectX = objectPos.x + velocity.x * t;
  const futureObjectZ = objectPos.z + velocity.z * t;

  const futurePlayerX = player.x + lateralVelocity * t;
  const futurePlayerZ = player.z - forwardSpeed * t;

  const dz = futurePlayerZ - futureObjectZ;

  return (
    dz > .21 &&
    dz < .99 &&
    Math.abs(futureObjectX - futurePlayerX) < .65 &&
    objectPos.y < objectRadius + .21
  );
};

/*
  Обновление движения.

  Перед предметом нет остановки.
  После отхода есть достаточно времени на боковое смещение
  и полный замах.
*/
updateGame = function(dt) {
  elapsed += dt;
  phaseTime += dt;

  if (mode === 'level') timer -= dt;

  pov.oldPlayer.copy(player);

  const keyboard =
    (keys.d || keys.ArrowRight ? 1 : 0) -
    (keys.a || keys.ArrowLeft ? 1 : 0);

  const axis = keyboard || moveAxis;

  // На замахе боковое движение не выключается,
  // но становится мягче: вес уже перенесён на опорную ногу.
  const strafeSpeed = phase === 'swing' ? 1.6 : 2.0;

  lateralVelocity = povDamp(
    lateralVelocity,
    axis * strafeSpeed,
    7,
    dt
  );

  player.x = clamp(
    player.x + lateralVelocity * dt,
    -4.72,
    4.72
  );

  if (phase === 'back') {
    const t = clamp(
      phaseTime / pov.retreatDuration,
      0,
      1
    );

    // Почти равномерный отход с мягким началом и окончанием.
    const eased = mix(t, povEase(t), .24);

    player.z = mix(
      pov.retreatFrom,
      pov.retreatTo,
      eased
    );

    forwardSpeed = -POV_UPDATE.retreatSpeed;

    if (t >= 1) {
      phase = 'walk';
      phaseTime = 0;
      forwardSpeed = POV_UPDATE.walkSpeed;

      pov.footState.forEach(f => {
        f.planted = false;
      });

      say(
        'ТЕПЕРЬ ЕСТЬ РАЗБЕГ',
        'Сначала выровняйся сбоку, затем начинай замах.',
        'var(--cyan)',
        2.2
      );
    }
  } else {
    const distance = gap();

    // Ускоряемся только вдали.
    // На последних метрах заранее возвращаемся к шагу.
    const targetSpeed = distance > 4.1
      ? clamp(
          POV_UPDATE.walkSpeed + (distance - 4.1) * .72,
          POV_UPDATE.walkSpeed,
          POV_UPDATE.runSpeed
        )
      : POV_UPDATE.walkSpeed;

    const response = targetSpeed < forwardSpeed ? 8 : 3;

    forwardSpeed = povDamp(
      forwardSpeed,
      targetSpeed,
      response,
      dt
    );

    player.z -= forwardSpeed * dt;
  }

  const moved = Math.hypot(
    player.x - pov.oldPlayer.x,
    player.z - pov.oldPlayer.z
  );

  pov.distanceWalked += moved;

  /*
    Фаза походки привязана к пройденной дистанции,
    а не к настенным часам.
  */
  pov.strideLength = povDamp(
    pov.strideLength,
    clamp(
      .62 + Math.max(0, Math.abs(forwardSpeed) - 1.08) * .105,
      .62,
      1.04
    ),
    5,
    dt
  );

  walkCycle += moved / pov.strideLength * Math.PI;

  if (held) {
    holdTime += dt;
    chargeValue = Math.min(1, holdTime / 1.2);

    const perfect =
      chargeValue >= .68 &&
      chargeValue <= .85;

    $('chargeFill').style.width =
      chargeValue * 100 + '%';

    $('chargeText').textContent =
      perfect
        ? 'СИЛА ИДЕАЛЬНА · ЛОВИ МОМЕНТ'
        : chargeValue > .94
          ? 'ПЕРЕЗАРЯД · СИЛЬНЫЙ ПОЛЁТ'
          : 'ЗАМАХ ' + Math.floor(chargeValue * 100) + '%';

    $('chargeText').style.color =
      perfect
        ? 'var(--cyan)'
        : chargeValue > .94
          ? 'var(--pink)'
          : 'white';
  }

  if (phase === 'swing') {
    if (
      phaseTime >= POV_UPDATE.impactTime &&
      !impactDone
    ) {
      applyImpact();
    }

    if (phaseTime > POV_UPDATE.swingDuration) {
      if (pendingBack) {
        beginRetreat();
      } else {
        phase = 'walk';
        phaseTime = 0;
        chargeValue = 0;

        pov.footState.forEach(f => {
          f.planted = false;
        });
      }
    }
  }

  updatePhysics(dt);

  if (phase === 'walk' && gap() < -.23) {
    say(
      'ПРОШЛИ МИМО',
      'Отходим подальше. На новом подходе времени хватит.',
      'var(--pink)',
      2.5
    );

    beginRetreat();
  }

  const step = Math.floor(walkCycle / Math.PI);

  if (step !== lastStep) {
    lastStep = step;

    noise(
      phase === 'back' ? .014 : .018,
      activeUp[2] === 0 ? .09 : .055
    );

    tone(
      activeUp[2] === 0 ? 69 : 91,
      .038,
      'triangle',
      .009,
      .55
    );
  }

  if (messageTime > 0) {
    messageTime -= dt;
    if (messageTime <= 0) {
      $('message').style.opacity = 0;
    }
  }

  pov.lookHold = Math.max(0, pov.lookHold - dt);
  shake = Math.max(0, shake - dt * .05);

  const horizontal = objectPos.x - player.x;
  const distance = gap();

  let text = '↑ АВТОМАТИЧЕСКИЙ ШАГ';
  let color = 'white';

  if (phase === 'back') {
    const remaining = Math.max(
      0,
      pov.retreatTo - player.z
    );

    text = '↩ ОТХОД · ещё ' + remaining.toFixed(1) + ' м';
    color = 'var(--pink)';
  } else if (phase === 'swing') {
    text = '👟 УДАР В ДВИЖЕНИИ';
  } else if (Math.abs(horizontal) > .65) {
    text =
      (horizontal > 0
        ? 'СМЕСТИСЬ ВПРАВО →'
        : '← СМЕСТИСЬ ВЛЕВО') +
      ' · ' +
      Math.abs(horizontal).toFixed(1) +
      ' м';

    color = 'var(--yellow)';
  } else if (reachable()) {
    text = held
      ? 'ОТПУСКАЙ — СЕЙЧАС!'
      : 'ПРЕДМЕТ РЯДОМ · БЕЙ!';

    color = 'var(--cyan)';
  } else if (distance > 1) {
    const seconds = Math.max(
      0,
      (distance - .83) /
      Math.max(POV_UPDATE.walkSpeed, forwardSpeed)
    );

    text = seconds < 1.7
      ? 'ЗАМАХИВАЙСЯ · ~' + seconds.toFixed(1) + ' с'
      : '↑ ПОДХОД · ' + distance.toFixed(1) + ' м';
  } else {
    text = 'ЛОВИ МОМЕНТ НА ШАГЕ';
  }

  $('proximity').textContent = text;
  $('proximity').style.color = color;

  $('kick').classList.toggle(
    'wait',
    phase !== 'walk'
  );

  $('kick').disabled = phase !== 'walk';

  // DOM не нужно обновлять с частотой физических подшагов.
  pov.uiClock += dt;

  if (pov.uiClock > .05) {
    updateHUD();
    pov.uiClock = 0;
  }

  if (mode === 'level') {
    if (runScore >= goal) {
      updateHUD();
      endRun(true);
    } else if (timer <= 0) {
      updateHUD();
      endRun(false);
    }
  }

  if (player.z < -1200) {
    const offset = 1000;

    player.z += offset;
    objectPos.z += offset;
    camera.position.z += offset;
    gaze.z += offset;

    retreatStart += offset;
    pov.retreatFrom += offset;
    pov.retreatTo += offset;
    pov.aimPoint.z += offset;

    if (shot?.contactPoint) {
      shot.contactPoint.z += offset;
    }

    pov.footState.forEach(f => {
      f.z += offset;
    });

    dust.forEach(p => {
      p.p.z += offset;
    });
  }
};

/*
  Походка с опорной фазой.

  Пока стопа опорная, её мировая координата остаётся
  приблизительно постоянной. Тело проходит над ней.
  Затем стопа переносится вперёд по дуге.
*/
function povWalkingFoot(rig, index, hipHeight) {
  const state = pov.footState[index];

  const motionSign = phase === 'back' ? -1 : 1;
  const offset = rig.side === 1 ? 0 : .5;

  let cycle = (
    walkCycle / (Math.PI * 2) + offset
  ) % 1;

  if (cycle < 0) cycle += 1;

  const stancePart = .61;
  const stride = pov.strideLength;

  let z;
  let y;
  let toe;

  if (!playing) {
    state.planted = false;
    return {
      z: -.05,
      y: .063,
      toe: 0,
      x: rig.side * .115
    };
  }

  if (cycle < stancePart) {
    const t = cycle / stancePart;

    if (!state.planted) {
      state.planted = true;

      state.z =
        player.z +
        mix(-stride * .49, stride * .49, t) *
        motionSign;

      state.x = player.x + rig.side * .115;
    }

    z = clamp(
      state.z - player.z,
      -stride * .72,
      stride * .72
    );

    // Перекат пятка → плоская стопа → носок.
    const heelLanding = 1 - smooth(0, .18, t);
    const toeOff = smooth(.73, 1, t);

    y = .062 + toeOff * .022;
    toe = -.12 * heelLanding + .24 * toeOff;
  } else {
    state.planted = false;

    const t = (cycle - stancePart) / (1 - stancePart);
    const travel = povEase(t);

    z = mix(
      stride * .49,
      -stride * .49,
      travel
    ) * motionSign;

    const clearance =
      .10 +
      clamp(Math.abs(forwardSpeed) - 1.1, 0, 4) * .012;

    y = .064 + Math.sin(Math.PI * t) * clearance;

    toe =
      mix(.19, -.10, travel) -
      Math.sin(Math.PI * t) * .06;

    state.x =
      player.x +
      rig.side * .115 +
      lateralVelocity * .018;
  }

  return {
    z,
    y,
    toe,
    x: clamp(
      state.x - player.x,
      rig.side * .115 - .065,
      rig.side * .115 + .065
    )
  };
}

/*
  Обновлённая анимация персонажа:
  — перенос веса;
  — постановка стоп;
  — подготовка, контакт, проводка и возврат;
  — руки компенсируют движение, оставаясь только в тени.
*/
updateCharacter = function() {
  const active = playing;
  const strike = phase === 'swing';

  const bodyBob = reducedMotion || !active
    ? 0
    : Math.cos(walkCycle * 2) * .006;

  const weightShift = reducedMotion || !active
    ? 0
    : Math.sin(walkCycle) * .010;

  const loading = held
    ? smooth(0, .65, chargeValue)
    : strike
      ? 1 - smooth(.30, POV_UPDATE.swingDuration, phaseTime)
      : 0;

  const kickSide = shot && strike
    ? shot.side || kickingSide
    : kickingSide;

  // При замахе вес перемещается на противоположную ногу.
  const supportShift = -kickSide * loading * .022;

  character.position.set(
    player.x + weightShift + supportShift,
    0,
    player.z
  );

  character.rotation.z =
    -lateralVelocity * .010 -
    weightShift * .35;

  const hipHeight =
    .94 +
    bodyBob -
    loading * .009;

  legs.forEach((rig, index) => {
    const foot = povWalkingFoot(rig, index, hipHeight);

    let footZ = foot.z;
    let footY = foot.y;
    let toe = foot.toe;

    const selected = rig.side === kickSide;
    let lateralAim = 0;

    if (held && selected) {
      const t = smooth(0, .62, chargeValue);

      footZ = mix(footZ, .25, t);
      footY = mix(footY, .23, t);
      toe = mix(toe, .12, t);

      pov.footState[index].planted = false;
    }

    if (strike && selected) {
      const target = shot.contactPoint || objectPos;

      const hitZ = clamp(
        target.z - player.z + .09,
        -.71,
        -.28
      );

      const hitY = shot.overhead ? .57 : .105;

      const t = phaseTime;

      if (t < POV_UPDATE.impactTime) {
        const u = povEase(t / POV_UPDATE.impactTime);

        footZ = mix(.25, hitZ, u);
        footY = mix(.23, hitY, u);
        toe = mix(.12, -.045, u);
      } else if (t < .37) {
        const u = povEase(
          (t - POV_UPDATE.impactTime) /
          (.37 - POV_UPDATE.impactTime)
        );

        // Небольшая проводка после контакта.
        footZ = mix(hitZ, hitZ - .055, u);
        footY = mix(hitY, hitY + .07, u);
        toe = mix(-.045, -.09, u);
      } else {
        const u = povEase(
          (t - .37) /
          (POV_UPDATE.swingDuration - .37)
        );

        footZ = mix(hitZ - .055, foot.z, u);
        footY = mix(hitY + .07, foot.y, u);
        toe = mix(-.09, foot.toe, u);
      }

      lateralAim = clamp(
        target.x - player.x - rig.side * .115,
        -.48,
        .48
      );

      pov.footState[index].planted = false;
    }

    rig.root.position.set(
      foot.x,
      hipHeight,
      0
    );

    rig.root.rotation.y = 0;
    rig.root.rotation.z = 0;

    if (strike && selected) {
      const envelope = phaseTime < POV_UPDATE.impactTime
        ? povEase(phaseTime / POV_UPDATE.impactTime)
        : 1 - smooth(.37, POV_UPDATE.swingDuration, phaseTime);

      // Нога действительно выносится к предмету сбоку.
      rig.root.rotation.z =
        Math.atan2(lateralAim, .82) * envelope;

      rig.root.rotation.y =
        -Math.atan2(lateralAim, .70) * .28 * envelope;
    }

    if (rig.club) {
      let angle = .055 + Math.sin(walkCycle) * .09;

      if (held && selected) {
        angle = -.38 * chargeValue;
      }

      if (strike && selected) {
        const maximum = shot.overhead ? 1.10 : .70;

        angle = phaseTime < POV_UPDATE.impactTime
          ? mix(
              -.38,
              maximum,
              povEase(phaseTime / POV_UPDATE.impactTime)
            )
          : mix(
              maximum,
              .055,
              smooth(
                POV_UPDATE.impactTime,
                POV_UPDATE.swingDuration,
                phaseTime
              )
            );
      }

      rig.thigh.rotation.x = angle;
    } else {
      solveLeg(
        rig,
        footY - hipHeight,
        footZ,
        toe
      );
    }
  });

  arms.forEach(arm => {
    const p = walkCycle + (
      arm.side === 1 ? Math.PI : 0
    );

    const swing = active ? Math.sin(p) : 0;
    const balance = loading;

    arm.shoulder.position.y = 1.38 + bodyBob;

    arm.upper.rotation.x =
      .07 + swing * .14 + balance * .09;

    arm.upper.rotation.z =
      arm.side * (.095 + balance * .13) +
      lateralVelocity * .018;

    arm.elbow.rotation.x =
      .25 +
      Math.max(0, -swing) * .12 +
      balance * .10;

    arm.hand.rotation.x = -.10;
    arm.hand.rotation.y = arm.side * .12;
    arm.hand.rotation.z = arm.side * .045;
  });

  if (pov.shadowParts) {
    const body = pov.shadowParts;

    body.root.position.y = bodyBob;
    body.root.rotation.x = -.018 - loading * .025;

    body.chest.rotation.y =
      active ? Math.sin(walkCycle) * .025 : 0;

    body.head.rotation.x =
      mix(.28, -.03, cameraLift);
  }

  character.updateMatrixWorld(true);

  legs.forEach((rig, i) => {
    rig.foot.getWorldPosition(footWorld);

    const contact = footContacts[i];

    contact.position.set(
      footWorld.x,
      .010,
      footWorld.z - .065
    );

    contact.material.opacity = rig.club
      ? 0
      : clamp(
          .49 - Math.max(0, footWorld.y - .04) * 2.5,
          .035,
          .45
        );

    contact.scale.setScalar(
      1 + Math.max(0, footWorld.y - .04) * .8
    );
  });

  bodyContact.position.set(
    player.x,
    .009,
    player.z - .035
  );

  bodyContact.material.opacity = .20;
};

/*
  Камера как на референсе.

  Базовое положение: почти вертикальный взгляд вниз.
  Подъём: только когда успешно пнутый предмет уходит вперёд.
  Ориентация сохраняет вертикаль кадра и не делает резких рывков.
*/
updateWorld = function(dt) {
  grassUniform.value = elapsed;

  updateCharacter();
  objectRoot.position.copy(objectPos);

  const center = Math.round(player.z / CHUNK) * CHUNK;

  chunks.forEach((chunk, i) => {
    chunk.group.position.z =
      center + (i - 5) * CHUNK;
  });

  mountains.position.z = player.z;
  sky.position.copy(camera.position);

  sun.position.set(
    player.x - 9,
    18,
    player.z + 10
  );

  sun.target.position.set(
    player.x,
    0,
    player.z - 3
  );

  objectContact.position.set(
    objectPos.x,
    .011,
    objectPos.z
  );

  objectContact.material.opacity = clamp(
    .75 - objectPos.y * .65,
    .06,
    .72
  );

  objectContact.scale.setScalar(
    1 + objectPos.y * .5
  );

  const distance = gap();

  marker.visible =
    playing &&
    phase !== 'back' &&
    distance > -.2 &&
    distance < 2.65;

  marker.position.set(
    objectPos.x,
    .018,
    objectPos.z
  );

  marker.material.color.set(
    reachable() ? 0x9ce4bd : 0xd8d8bf
  );

  marker.material.opacity =
    reachable() ? .36 : .14;

  // Постоянная стрелка поверх земли мешала виду как на фото.
  // Показываем её только во время подготовки близкого удара.
  directionArrow.visible =
    playing &&
    held &&
    phase === 'walk' &&
    distance > .2 &&
    distance < 1.55;

  if (directionArrow.visible) {
    const angle = clamp(
      Math.atan2(
        objectPos.x - player.x,
        Math.max(.35, distance)
      ),
      -.93,
      .93
    );

    directionArrow.position.set(
      objectPos.x,
      .038,
      objectPos.z
    );

    directionArrow.setDirection(
      V(Math.sin(angle), 0, -Math.cos(angle))
    );

    directionArrow.line.material.opacity = .25;
    directionArrow.cone.material.opacity = .25;
  }

  const speed = velocity.length();

  const flyingForward =
    lookFlight &&
    phase !== 'back' &&
    distance > 1.75 &&
    (speed > .65 || pov.lookHold > 0);

  const liftTarget = flyingForward ? 1 : 0;

  cameraLift = povDamp(
    cameraLift,
    liftTarget,
    flyingForward ? 4.0 : 3.2,
    dt
  );

  if (
    speed < .15 &&
    pov.lookHold <= 0
  ) {
    lookFlight = false;
  }

  const bob = reducedMotion || !playing
    ? 0
    : Math.cos(walkCycle * 2) * .005;

  const lateralBob = reducedMotion || !playing
    ? 0
    : Math.sin(walkCycle) * .003;

  cameraTarget.set(
    player.x + lateralBob,
    1.665 + bob,
    player.z + .055
  );

  camera.position.lerp(
    cameraTarget,
    1 - Math.exp(-dt * 16)
  );

  const downTarget = V(
    player.x + lateralVelocity * .012,
    .07,
    player.z - POV_UPDATE.downLookDistance
  );

  /*
    При сопровождении смотрим немного дальше предмета.
    Так камера действительно направляется вперёд,
    а не просто меняет угол на несколько градусов.
  */
  const flightTarget = V(
    objectPos.x + pov.lastShotDirection.x * 1.15,
    Math.max(.17, objectPos.y * .5),
    objectPos.z + pov.lastShotDirection.z * 1.55
  );

  gazeTarget.lerpVectors(
    downTarget,
    flightTarget,
    cameraLift
  );

  gaze.lerp(
    gazeTarget,
    1 - Math.exp(-dt * 10)
  );

  camera.up.set(0, 1, 0);
  camera.lookAt(gaze);

  if (!reducedMotion) {
    camera.rotation.z +=
      -lateralVelocity * .0035 +
      Math.sin(walkCycle) * .0018;

    // Детерминированный короткий импульс вместо дрожащего рандома.
    camera.rotation.x +=
      Math.sin(elapsed * 39) * shake * .28;
  }

  const targetFov =
    (innerWidth < innerHeight ? 75 : 71) +
    cameraLift * 2;

  if (Math.abs(camera.fov - targetFov) > .01) {
    camera.fov = povDamp(
      camera.fov,
      targetFov,
      4,
      dt
    );

    camera.updateProjectionMatrix();
  }
};

/* ============================================================
   Конец обновления.
   Ниже остаётся исходный цикл frame(), home() и запуск игры.
   ============================================================ */

/* ==========================================================
   ИСПРАВЛЕНИЕ: естественный POV, стопы на земле,
   более удобное попадание по веточке.
   Ставится ПОСЛЕ предыдущего обновления, перед let previous...
   ========================================================== */

const naturalPOV = {
  // Камера впереди линии таза:
  // верхние части ног оказываются за нижней границей кадра.
  height: 1.60,
  forwardOffset: .29,
  downDistance: .55,

  gaze: V(),
  cameraPosition: V(),
  initialized: false,
  modePlaying: false,

  pendingKick: null,
  passingQueuedKick: false,
  follow: 0
};

/* ---------- СБРОС ПРИ НОВОМ ЗАБЕГЕ ---------- */

const naturalStartRun = startRun;

startRun = function(newMode, level = null) {
  naturalPOV.pendingKick = null;
  naturalPOV.initialized = false;
  naturalPOV.follow = 0;

  naturalStartRun(newMode, level);
};

const naturalHome = home;

home = function() {
  naturalPOV.pendingKick = null;
  naturalPOV.initialized = false;
  naturalPOV.follow = 0;

  naturalHome();
};

const naturalResetInput = resetInput;

resetInput = function() {
  naturalPOV.pendingKick = null;
  naturalResetInput();
};

const naturalRetreat = beginRetreat;

beginRetreat = function() {
  naturalPOV.pendingKick = null;
  naturalRetreat();
};

/* ---------- ПОСТАНОВКА СТОП ---------- */

/*
  Раньше нога иногда не доставала до вычисленной точки:
  IK ограничивал длину, а стопа оставалась над землёй.

  Немного опускаем таз и пересчитываем цель относительно
  нового положения сустава. Целевая высота стопы сохраняется.
*/
const naturalSolveLeg = solveLeg;

solveLeg = function(rig, y, z, toePitch = 0) {
  const hipCorrection = .048;

  rig.root.position.y -= hipCorrection;

  naturalSolveLeg(
    rig,
    y + hipCorrection,
    z,
    toePitch
  );
};

/*
  Полный шаг:
  1. Стопа опирается на землю.
  2. Тело проходит над ней.
  3. Стопа переносится вперёд по невысокой дуге.

  Без постоянного "велосипеда" ногами.
*/
povWalkingFoot = function(rig, index, hipHeight) {
  const state = pov.footState[index];

  if (!playing) {
    state.planted = false;

    return {
      x: rig.side * .115,
      y: .058,
      z: -.045,
      toe: 0
    };
  }

  const direction = phase === 'back' ? -1 : 1;
  const offset = rig.side === 1 ? 0 : .5;

  let cycle = (
    walkCycle / (Math.PI * 2) + offset
  ) % 1;

  if (cycle < 0) cycle += 1;

  const stanceFraction = .55;

  // Не позволяем шагу растягивать ногу за пределы её длины.
  const halfTravel = Math.min(
    .37,
    pov.strideLength * stanceFraction
  );

  let z;
  let y;
  let toe;

  if (cycle < stanceFraction) {
    const t = cycle / stanceFraction;

    if (
      !state.planted ||
      state.direction !== direction
    ) {
      state.planted = true;
      state.direction = direction;

      state.z = player.z + mix(
        -halfTravel,
        halfTravel,
        t
      ) * direction;

      state.x = player.x + rig.side * .115;
    }

    z = clamp(
      state.z - player.z,
      -.39,
      .39
    );

    const heelContact = 1 - smooth(0, .15, t);
    const toeOff = smooth(.83, 1, t);

    // Практически вся опорная фаза проходит на одной высоте.
    y = .057 + toeOff * .012;

    toe =
      -.07 * heelContact +
      .15 * toeOff;
  } else {
    state.planted = false;
    state.direction = direction;

    const t = (
      cycle - stanceFraction
    ) / (1 - stanceFraction);

    const travel = povEase(t);

    z = mix(
      halfTravel,
      -halfTravel,
      travel
    ) * direction;

    // Нога не взлетает до колена на каждом шаге.
    const clearance = .066 + clamp(
      Math.abs(forwardSpeed) - 1.1,
      0,
      3
    ) * .009;

    y = .057 + Math.sin(Math.PI * t) * clearance;

    toe = mix(.12, -.065, travel);

    state.x =
      player.x +
      rig.side * .115 +
      lateralVelocity * .012;
  }

  return {
    z,
    y,
    toe,
    x: clamp(
      state.x - player.x,
      rig.side * .115 - .05,
      rig.side * .115 + .05
    )
  };
};

/*
  Связываем невидимое тело с немного опущенным тазом,
  чтобы силуэт тени оставался цельным.
*/
const naturalCharacter = updateCharacter;

updateCharacter = function() {
  naturalCharacter();

  if (pov.shadowParts) {
    pov.shadowParts.root.position.y -= .025;
  }

  arms.forEach(arm => {
    arm.shoulder.position.y -= .025;
  });
};

/* ---------- ПОПАДАНИЕ ---------- */

function naturalHitLimits() {
  if (activeUp[1] === 0) {
    return {
      side: .84,
      near: -.07,
      far: 1.04,
      height: .27
    };
  }

  if (activeUp[1] === 1) {
    return {
      side: .77,
      near: -.04,
      far: 1.00,
      height: .25
    };
  }

  return {
    side: .68,
    near: .02,
    far: .96,
    height: .23
  };
}

/*
  Это намеренно более широкая игровая область контакта,
  а не точное столкновение с миллиметровой геометрией ветки.

  Стартовое смещение предмета всё ещё больше этой области:
  начать забег, вообще не двигаясь вбок, не получится.
*/
reachable = function(predicted = true) {
  const limits = naturalHitLimits();
  const t = predicted ? POV_UPDATE.impactTime : 0;

  const predictedX =
    objectPos.x + velocity.x * t -
    (player.x + lateralVelocity * t);

  const predictedZ =
    player.z - Math.max(0, forwardSpeed) * t -
    (objectPos.z + velocity.z * t);

  return (
    Math.abs(predictedX) <= limits.side &&
    predictedZ >= limits.near &&
    predictedZ <= limits.far &&
    objectPos.y <= objectRadius + limits.height
  );
};

/*
  Небольшой буфер раннего отпускания.

  Если до удара осталось меньше примерно секунды,
  сохраняем выбранную силу и завершаем движение ноги
  на подходе. Далёкий удар по воздуху не превращаем
  в автоматическое попадание.
*/
const naturalReleaseCharge = releaseCharge;

releaseCharge = function() {
  if (
    !naturalPOV.passingQueuedKick &&
    held &&
    canCharge()
  ) {
    const limits = naturalHitLimits();

    const predictedGap =
      gap() -
      Math.max(
        POV_UPDATE.walkSpeed,
        forwardSpeed
      ) * POV_UPDATE.impactTime;

    const sideways = Math.abs(
      objectPos.x - player.x
    );

    if (
      predictedGap > .88 &&
      predictedGap < 1.85 &&
      sideways < limits.side + .16 &&
      velocity.length() < .6
    ) {
      naturalPOV.pendingKick = {
        charge: chargeValue,
        holdTime,
        side: kickingSide,
        life: 1.1
      };

      held = false;

      $('kick').classList.remove('held');
      $('charge').style.opacity = .8;
      $('chargeText').textContent =
        'ЗАМАХ ГОТОВ · ЗАВЕРШАЕМ НА ПОДХОДЕ';

      return;
    }
  }

  naturalReleaseCharge();
};

const naturalStartCharge = startCharge;

startCharge = function() {
  if (naturalPOV.pendingKick) return;
  naturalStartCharge();
};

/*
  Пока ранний удар ожидает подхода, сохраняем позу замаха.
*/
const naturalPreparedCharacter = updateCharacter;

updateCharacter = function() {
  const pending = naturalPOV.pendingKick;

  if (!pending) {
    naturalPreparedCharacter();
    return;
  }

  const previousHeld = held;
  const previousCharge = chargeValue;
  const previousSide = kickingSide;

  held = true;
  chargeValue = pending.charge;
  kickingSide = pending.side;

  naturalPreparedCharacter();

  held = previousHeld;
  chargeValue = previousCharge;
  kickingSide = previousSide;
};

/* Реальный контакт проверяется в момент удара. */
applyImpact = function() {
  impactDone = true;

  const limits = naturalHitLimits();
  const dz = gap();
  const dx = objectPos.x - player.x;

  const inRange =
    Math.abs(dx) <= limits.side &&
    dz >= limits.near &&
    dz <= limits.far &&
    objectPos.y <= objectRadius + limits.height;

  if (shot.overhead || !inRange) {
    pendingBack = true;

    tone(135, .14, 'sine', .026, .45);

    let title;
    let description;

    if (shot.overhead) {
      title = 'НОГА ПРОШЛА ВЫШЕ';
      description =
        'Те самые 2%. Отходим и спокойно пробуем ещё.';
    } else if (Math.abs(dx) > limits.side) {
      title = 'ЧУТЬ БЛИЖЕ К ПРЕДМЕТУ';
      description =
        'На следующем подходе сместись немного вбок.';
    } else if (dz > limits.far) {
      title = 'РАНОВАТО';
      description =
        'Замах заранее — хорошо. Отпускай чуть ближе.';
    } else {
      title = 'НЕМНОГО ПОЗДНО';
      description =
        'Отходим подальше. Следующий момент ты поймаешь.';
    }

    say(
      title,
      description,
      'var(--pink)',
      2.3
    );

    return;
  }

  /*
    Направление по-прежнему определяется стороной подхода,
    а не отдельным виртуальным прицелом.
  */
  const angle = clamp(
    Math.atan2(dx, Math.max(.49, dz)),
    -.92,
    .92
  );

  const strength =
    (.2 + .8 * shot.charge) *
    (
      shot.perfect
        ? 1.2
        : shot.strong
          ? 1.34
          : 1
    );

  const speed =
    power() *
    ITEMS[activeUp[1]][2] *
    strength;

  velocity.set(
    Math.sin(angle) * speed,
    0,
    -Math.cos(angle) * speed
  );

  /*
    Обычный удар больше скользит по земле.
    Подпрыгивание оставлено для сильного удара
    и упругих предметов.
  */
  verticalVelocity = shot.strong
    ? .9 + speed * .035
    : activeUp[1] === 6
      ? .34
      : .10;

  shotMultiplier = shot.perfect
    ? 1.65
    : shot.strong
      ? .92
      : 1;

  reward(2 * income() * shotMultiplier);

  lookFlight = true;

  pov.lastShotDirection
    .copy(velocity)
    .setY(0)
    .normalize();

  pov.lookHold = shot.strong ? 1.5 : .7;
  shake = 0;

  burst(objectPos, shot.perfect ? 22 : 12);

  tone(
    activeUp[1] >= 8 ? 103 : 150,
    .10,
    'triangle',
    .06,
    .3
  );

  noise(.025, .06);

  if (shot.perfect) {
    perfectCount++;

    floating('В САМЫЙ РАЗ! ×1.65', 'var(--cyan)');

    say(
      'ХОРОШ!',
      'Поймал момент прямо на шаге.',
      'var(--cyan)',
      1.25
    );
  } else if (shot.strong) {
    say(
      'ВОТ ЭТО ПИНOК!',
      'Смотрим, куда улетел предмет.',
      'var(--yellow)',
      1.3
    );
  } else {
    say(
      'ПОПАЛ!',
      Math.abs(dx) > .18
        ? dx > 0
          ? 'Слева направо — всё как в жизни.'
          : 'Справа налево — хороший контакт.'
        : 'Спокойный пинок вперёд.',
      'white',
      1.05
    );
  }

  persist();
};

/* ---------- БУФЕР УДАРА В ИГРОВОМ ЦИКЛЕ ---------- */

const naturalUpdateGame = updateGame;

updateGame = function(dt) {
  const pending = naturalPOV.pendingKick;

  if (pending && phase === 'walk' && !paused) {
    pending.life -= dt;

    const projectedGap =
      gap() -
      Math.max(
        POV_UPDATE.walkSpeed,
        forwardSpeed
      ) * POV_UPDATE.impactTime;

    if (
      projectedGap <= .86 ||
      pending.life <= 0
    ) {
      naturalPOV.pendingKick = null;

      held = true;
      chargeValue = pending.charge;
      holdTime = pending.holdTime;
      kickingSide = pending.side;

      naturalPOV.passingQueuedKick = true;
      releaseCharge();
      naturalPOV.passingQueuedKick = false;
    }
  }

  naturalUpdateGame(dt);

  /*
    Предыдущий интерфейс использовал старую боковую границу.
    Уточняем подсказку под новую область контакта.
  */
  if (
    playing &&
    !paused &&
    phase === 'walk'
  ) {
    if (naturalPOV.pendingKick) {
      $('proximity').textContent =
        'ЗАМАХ ГОТОВ · ЕЩЁ ПОЛШАГА';

      $('proximity').style.color = 'var(--cyan)';
    } else if (reachable()) {
      $('proximity').textContent = held
        ? 'ОТПУСКАЙ — ПОПАДЁШЬ!'
        : 'ПРЕДМЕТ В ЗОНЕ УДАРА';

      $('proximity').style.color = 'var(--cyan)';
    }
  }
};

/* ---------- КАМЕРА БЕЗ ЭФФЕКТА ПАРЕНИЯ ---------- */

const naturalUpdateWorld = updateWorld;

updateWorld = function(dt) {
  /*
    Сохраняем обновление травы, персонажа, освещения,
    контактных теней и окружения.
    Камеру после него задаём отдельно.
  */
  naturalUpdateWorld(dt);

  const stepDt = playing && !paused ? dt : 0;

  const targetPosition = V(
    player.x,
    naturalPOV.height,
    player.z - naturalPOV.forwardOffset
  );

  const shouldFollow =
    lookFlight &&
    phase !== 'back' &&
    gap() > 1.65 &&
    (
      velocity.length() > .55 ||
      pov.lookHold > 0
    );

  if (
    !naturalPOV.initialized ||
    naturalPOV.modePlaying !== playing
  ) {
    naturalPOV.initialized = true;
    naturalPOV.modePlaying = playing;

    naturalPOV.cameraPosition.copy(targetPosition);

    naturalPOV.gaze.set(
      targetPosition.x,
      .065,
      targetPosition.z - naturalPOV.downDistance
    );

    naturalPOV.follow = 0;
  }

  if (stepDt > 0) {
    naturalPOV.follow = povDamp(
      naturalPOV.follow,
      shouldFollow ? 1 : 0,
      shouldFollow ? 4.3 : 3.5,
      stepDt
    );

    /*
      Камера следует за телом почти жёстко.
      Сильное отставание камеры от игрока тоже
      создавало ощущение отдельного летящего наблюдателя.
    */
    naturalPOV.cameraPosition.lerp(
      targetPosition,
      1 - Math.exp(-stepDt * 24)
    );
  } else {
    naturalPOV.cameraPosition.copy(targetPosition);
  }

  const down = V(
    targetPosition.x,
    .065,
    targetPosition.z - naturalPOV.downDistance
  );

  const forward = V(
    objectPos.x + pov.lastShotDirection.x * .8,
    Math.max(.15, objectPos.y * .55),
    objectPos.z + pov.lastShotDirection.z * 1.2
  );

  const targetLook = down.clone().lerp(
    forward,
    naturalPOV.follow
  );

  if (stepDt > 0) {
    naturalPOV.gaze.lerp(
      targetLook,
      1 - Math.exp(-stepDt * 13)
    );
  } else if (!playing) {
    naturalPOV.gaze.copy(down);
  }

  camera.position.copy(naturalPOV.cameraPosition);

  // Без "дыхания" FOV и заваливания горизонта.
  camera.fov = innerWidth < innerHeight ? 64 : 68;
  camera.up.set(0, 1, 0);

  camera.lookAt(naturalPOV.gaze);
  camera.updateProjectionMatrix();

  /*
    Обновляем и общие переменные камеры,
    используемые при переносе начала координат.
  */
  gaze.copy(naturalPOV.gaze);
  cameraLift = naturalPOV.follow;

  sky.position.copy(camera.position);
};

/*
  Синхронизация отдельной камеры при переносе координат
  в очень длинном забеге.
*/
const naturalFloatingOriginUpdate = updateGame;

updateGame = function(dt) {
  const previousZ = player.z;

  naturalFloatingOriginUpdate(dt);

  const jump = player.z - previousZ;

  if (jump > 500) {
    naturalPOV.cameraPosition.z += 1000;
    naturalPOV.gaze.z += 1000;
  }
};

/* Убираем эмодзи из существующего интерфейса, сохраняя DOM. */
function calmText(text) {
  return text
    .replace(
      /[\p{Extended_Pictographic}\uFE0F\u200D\u20E3]/gu,
      ''
    )
    .replace(/[ \t]{2,}/g, ' ');
}

function cleanInterfaceText(root) {
  if (!root) return;

  const walker = document.createTreeWalker(
    root,
    NodeFilter.SHOW_TEXT
  );

  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach(node => {
    const clean = calmText(node.nodeValue);
    if (clean !== node.nodeValue) node.nodeValue = clean;
  });
}

/* -------------------- МЕТРИКИ -------------------- */

/*
  Метрики отправляются только после включения пользователем.

  Не собираем:
  — имя;
  — email;
  — IP в коде игры;
  — отпечаток браузера;
  — точную модель устройства.

  Google как провайдер сервиса может обрабатывать
  технические данные сетевых запросов.
*/

function safeLocalGet(key) {
  try { return localStorage.getItem(key); }
  catch(e) { return null; }
}

function safeLocalSet(key, value) {
  try { localStorage.setItem(key, value); }
  catch(e) {}
}

function eventId() {
  if (globalThis.crypto?.randomUUID) {
    return crypto.randomUUID();
  }

  return (
    Date.now().toString(36) + '-' +
    Math.random().toString(36).slice(2) + '-' +
    Math.random().toString(36).slice(2)
  );
}

const METRICS = {
  consent:
    safeLocalGet(RELEASE_CONFIG.telemetryConsentKey) === 'yes',

  sessionId:eventId(),
  queue:[],
  busy:false,
  run:null,
  lastUp:[...save.up],
  lastAttempt:0,

  configured() {
    return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/
      .test(RELEASE_CONFIG.webAppUrl.trim());
  },

  saveQueue() {
    safeLocalSet(
      RELEASE_CONFIG.telemetryQueueKey,
      JSON.stringify(this.queue.slice(-150))
    );
  },

  emit(type, data = {}) {
    if (!this.consent || !this.configured()) return;

    const event = {
      event_id:eventId(),
      client_time:new Date().toISOString(),
      session_id:this.sessionId,
      run_id:this.run?.id || '',
      event:type,
      mode:playing || this.run ? mode : '',
      level:mode === 'level' ? (spec?.n || 0) : 0,

      coins_balance:save.coins,
      up_leg:activeUp[0],
      up_item:activeUp[1],
      up_surface:activeUp[2],

      device:mobile ? 'touch' : 'desktop',
      version:RELEASE_CONFIG.version,

      ...data
    };

    this.queue.push(event);
    this.queue = this.queue.slice(-150);
    this.saveQueue();

    if (
      type === 'run_end' ||
      this.queue.length >= 15
    ) {
      this.flush();
    }
  },

  async flush() {
    if (
      this.busy ||
      !this.consent ||
      !this.configured() ||
      !this.queue.length
    ) return;

    this.busy = true;
    this.lastAttempt = Date.now();

    const batch = this.queue.slice(0, 20);
    const ids = new Set(batch.map(e => e.event_id));

    try {
      /*
        Apps Script и CORS:
        отправляем простой POST без нестандартных заголовков.
        Ответ opaque — прочитать подтверждение записи нельзя.
      */
      await fetch(RELEASE_CONFIG.webAppUrl.trim(), {
        method:'POST',
        mode:'no-cors',
        credentials:'omit',
        redirect:'follow',
        keepalive:true,
        headers:{
          'Content-Type':'text/plain;charset=UTF-8'
        },
        body:JSON.stringify({
          token:RELEASE_CONFIG.telemetryToken,
          events:batch
        })
      });

      // Сеть приняла отправку, но это НЕ подтверждение записи.
      this.queue = this.queue.filter(e => !ids.has(e.event_id));
      this.saveQueue();
    } catch(e) {
      // При сетевой ошибке оставляем события для следующей попытки.
      console.warn('Метрики: отправка отложена.');
    } finally {
      this.busy = false;
    }
  },

  setConsent(value) {
    this.consent = Boolean(value);

    safeLocalSet(
      RELEASE_CONFIG.telemetryConsentKey,
      this.consent ? 'yes' : 'no'
    );

    if (!this.consent) {
      this.queue = [];
      this.saveQueue();
    } else {
      this.emit('analytics_enabled', {
        reason:'user_opt_in'
      });
      this.flush();
    }
  }
};

try {
  const stored = JSON.parse(
    safeLocalGet(RELEASE_CONFIG.telemetryQueueKey) || '[]'
  );

  if (METRICS.consent && Array.isArray(stored)) {
    METRICS.queue = stored
      .filter(e =>
        e &&
        typeof e === 'object' &&
        typeof e.event_id === 'string'
      )
      .slice(-150);
  }
} catch(e) {}

setInterval(() => METRICS.flush(), 12000);

/* -------------------- БЫСТРАЯ ШКАЛА -------------------- */

const timingMeter = {
  seconds:0,
  direction:1,
  value:0
};

function timingValue(seconds) {
  const phase =
    (seconds / RELEASE_CONFIG.meterTravelTime) % 2;

  return phase <= 1 ? phase : 2 - phase;
}

function timingQuality(value) {
  /*
    Гладкий пик в середине идеальной области.
    На правом конце шкалы удар уже заметно слабее.
  */
  const offset =
    (value - RELEASE_CONFIG.perfectCenter) / .32;

  return Math.exp(-offset * offset);
}

function decorateShot() {
  if (!shot) return;

  shot.perfect =
    shot.charge >= RELEASE_CONFIG.perfectStart &&
    shot.charge <= RELEASE_CONFIG.perfectEnd;

  shot.quality = timingQuality(shot.charge);

  /*
    Самый сильный удар больше НЕ находится на 100%.
    Сильный полёт теперь связан с точным попаданием в область.
  */
  shot.strong = shot.perfect;
}

const releaseStartCharge = startCharge;

startCharge = function() {
  const previouslyHeld = held;

  releaseStartCharge();

  if (!previouslyHeld && held) {
    timingMeter.seconds = 0;
    timingMeter.direction = 1;
    timingMeter.value = 0;

    holdTime = 0;
    chargeValue = 0;
  }
};

const releaseReleaseCharge = releaseCharge;

releaseCharge = function() {
  const previousShot = shot;

  releaseReleaseCharge();

  if (
    phase === 'swing' &&
    shot &&
    shot !== previousShot
  ) {
    decorateShot();
  }
};

/*
  Совместимость с прежним циклом:
  внутри старого updateGame значение рассчитывается из holdTime.
  Передаём ему подготовленное значение треугольной шкалы.
*/
const releaseUpdateGame = updateGame;

updateGame = function(dt) {
  if (
    held &&
    phase === 'walk' &&
    !naturalPOV.pendingKick
  ) {
    timingMeter.seconds += dt;

    const previousValue = timingMeter.value;
    const nextValue = timingValue(timingMeter.seconds);

    timingMeter.direction =
      nextValue >= previousValue ? 1 : -1;

    timingMeter.value = nextValue;

    // Старый цикл прибавит dt и разделит на 1.2.
    holdTime = nextValue * 1.2 - dt;
  }

  releaseUpdateGame(dt);

  if (held && phase === 'walk') {
    const ideal =
      chargeValue >= RELEASE_CONFIG.perfectStart &&
      chargeValue <= RELEASE_CONFIG.perfectEnd;

    $('chargeFill').style.width =
      (chargeValue * 100).toFixed(1) + '%';

    $('chargeFill').style.background =
      ideal ? '#c9ebd6' : '#a4b7ac';

    $('chargeText').textContent =
      ideal
        ? 'Идеальная сила · отпускай'
        : timingMeter.direction > 0
          ? 'Рост · поймай светлую область'
          : 'Возврат · область можно поймать снова';

    $('chargeText').style.color =
      ideal ? '#c9ebd6' : '#e1e9e1';
  }

  cleanInterfaceText($('proximity'));
};

/* -------------------- СИЛА УДАРА -------------------- */

applyImpact = function() {
  impactDone = true;
  decorateShot();

  const limits = naturalHitLimits();
  const dz = gap();
  const dx = objectPos.x - player.x;

  const inRange =
    Math.abs(dx) <= limits.side &&
    dz >= limits.near &&
    dz <= limits.far &&
    objectPos.y <= objectRadius + limits.height;

  const hit = !shot.overhead && inRange;

  if (METRICS.run) {
    METRICS.run.chargeSum += shot.charge;
    METRICS.run.samples++;

    if (hit) {
      METRICS.run.hits++;
    } else if (shot.overhead) {
      METRICS.run.overheadMisses++;
    } else {
      METRICS.run.contactMisses++;
    }
  }

  if (!hit) {
    pendingBack = true;

    tone(132, .13, 'sine', .022, .48);

    const title = shot.overhead
      ? 'Выше предмета'
      : Math.abs(dx) > limits.side
        ? 'Немного в стороне'
        : dz > limits.far
          ? 'Чуть рано'
          : 'Чуть поздно';

    say(
      title,
      'Отходим подальше. Следующий подход будет спокойнее.',
      'var(--pink)',
      2
    );

    return;
  }

  const quality = shot.quality;

  // Максимум строго в центре идеальной области.
  const strength = .17 + 1.03 * quality;

  const speed =
    power() *
    ITEMS[activeUp[1]][2] *
    strength;

  const angle = clamp(
    Math.atan2(dx, Math.max(.49, dz)),
    -.92,
    .92
  );

  velocity.set(
    Math.sin(angle) * speed,
    0,
    -Math.cos(angle) * speed
  );

  verticalVelocity = shot.perfect
    ? .45 + speed * .025
    : activeUp[1] === 6
      ? .27
      : .08;

  shotMultiplier = shot.perfect
    ? 1.4
    : .78 + quality * .22;

  reward(2 * income() * shotMultiplier);

  lookFlight = true;
  pov.lookHold = shot.perfect ? 1.25 : .6;

  pov.lastShotDirection
    .copy(velocity)
    .setY(0)
    .normalize();

  shake = 0;

  burst(objectPos, shot.perfect ? 22 : 10);

  tone(
    activeUp[1] >= 8 ? 103 : 149,
    .095,
    'triangle',
    .055,
    .3
  );

  noise(.021, .055);

  if (shot.perfect) {
    perfectCount++;

    floating('Точный удар · ×1,4', 'var(--cyan)');

    say(
      'В самый момент',
      'Идеальная сила и хороший контакт.',
      'var(--cyan)',
      1.2
    );
  } else {
    say(
      'Хороший контакт',
      quality < .65
        ? 'Сильнее всего — в центре светлой области.'
        : 'Ещё немного ближе к центру шкалы.',
      'white',
      1.15
    );
  }

  persist();
};

/* -------------------- УРОВНИ И НАГРАДЫ -------------------- */

function levelReward(number) {
  return RELEASE_CONFIG.firstLevelReward +
    Math.max(0, number - 1) * RELEASE_CONFIG.rewardStep;
}

const releaseLevelSpec = levelSpec;

levelSpec = function(number) {
  const s = releaseLevelSpec(number);

  /*
    Цель повышается относительно прежней генерации.
    Время слегка сокращается, но остаётся не меньше минуты.
    Набор по номеру уровня по-прежнему воспроизводим.
  */
  const difficulty = 1.65 +
    Math.min(30, number - 1) * .012;

  return {
    ...s,
    duration:Math.max(60, s.duration - 5),
    goal:Math.max(
      50,
      Math.ceil(s.goal * difficulty / 5) * 5
    )
  };
};
