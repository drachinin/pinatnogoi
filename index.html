const releaseStartRun = startRun;

startRun = function(newMode, level = null) {
  releaseStartRun(newMode, level);

  METRICS.lastUp = [...save.up];

  METRICS.run = {
    id:eventId(),
    hits:0,
    overheadMisses:0,
    contactMisses:0,
    chargeSum:0,
    samples:0
  };

  METRICS.emit('run_start', {
    target:mode === 'level' ? goal : 0,
    duration_s:0
  });
};

const releasePersist = persist;

persist = function() {
  releasePersist();

  for (let i = 0; i < 3; i++) {
    if (save.up[i] > METRICS.lastUp[i]) {
      const upgrade = save.up[i];

      METRICS.emit('upgrade', {
        coins_delta:-TABLES[i][upgrade][1],
        reason:[
          'leg',
          'item',
          'surface'
        ][i] + ':' + upgrade
      });
    }
  }

  METRICS.lastUp = [...save.up];
};

/* -------------------- ЭКРАН РЕЗУЛЬТАТА -------------------- */

endRun = function(won = false) {
  if (!playing) return;

  const isLevel = mode === 'level';
  const previousSpec = spec;
  const completedRun = METRICS.run;

  const result = isLevel
    ? won ? 'won' : 'failed'
    : 'finished';

  playing = false;
  resetInput();
  velocity.set(0, 0, 0);

  const bonus = isLevel && won
    ? levelReward(previousSpec.n)
    : 0;

  if (isLevel) {
    save.coins += bonus;

    if (won && save.level === previousSpec.n) {
      save.level++;
    }
  }

  save.best = Math.max(save.best, runDistance);
  persist();

  const earned = isLevel ? bonus : runCoins;

  METRICS.emit('run_end', {
    result,
    level:isLevel ? previousSpec.n : 0,
    duration_s:Number(elapsed.toFixed(2)),
    score:runScore,
    target:isLevel ? goal : 0,
    distance_m:Number(runDistance.toFixed(2)),
    coins_delta:earned,
    kicks:kickCount,
    hits:completedRun?.hits || 0,
    misses:missCount,
    perfects:perfectCount,
    avg_charge:completedRun?.samples
      ? Number((
          completedRun.chargeSum /
          completedRun.samples
        ).toFixed(4))
      : 0,
    reason:isLevel
      ? won
        ? 'target_reached'
        : timer <= 0
          ? 'time_limit'
          : 'manual_finish'
      : 'manual_finish'
  });

  METRICS.run = null;
  METRICS.flush();

  $('hud').classList.add('hidden');

  if (won || !isLevel) cheer();

  const title = isLevel
    ? won ? 'Уровень пройден' : 'Хорошая попытка'
    : 'Прогулка завершена';

  const encouragement = isLevel && !won
    ? 'Этот набор требует точности. Ты уже лучше чувствуешь дистанцию и ритм — это важнее одной неудачной попытки. Попробуй ещё, у тебя получится.'
    : runDistance < 1
      ? 'Первый шаг уже сделан. Не торопись: выбери сторону подхода и поймай светлую область шкалы. Ты справишься.'
      : 'Ты хорошо поймал ритм движения. Каждый точный контакт и каждый пройденный метр — твоя работа. Отличный результат.';

  panel(`
    <div class="eyebrow">
      ${isLevel ? 'Уровень ' + previousSpec.n : 'Свободный режим'}
    </div>

    <h2>${title}</h2>
    <p class="hero">${encouragement}</p>

    <div class="miniGrid">
      <div class="mini">
        <b>${fmt(runDistance)}</b>метров
      </div>
      <div class="mini">
        <b>${fmt(runScore)}</b>очков
      </div>
      <div class="mini">
        <b>${earned}</b>монет
      </div>
    </div>

    <div class="tip">
      Ударов — ${kickCount}.
      Идеальных — ${perfectCount}.
      Отходов — ${missCount}.
      ${
        isLevel && !won
          ? '<br>Монеты за уровень начисляются только за победу.'
          : '<br>Заработанные монеты сохранены.'
      }
    </div>

    <button class="primary" id="again">
      ${
        isLevel
          ? won ? 'Следующий уровень' : 'Попробовать ещё'
          : 'Новая прогулка'
      }
    </button>

    <button class="secondary" id="resultHome">В меню</button>
  `);

  $('again').onclick = () => {
    if (isLevel) {
      if (won) levelPreview();
      else startRun('level', previousSpec);
    } else {
      startRun('free');
    }
  };

  $('resultHome').onclick = home;
};

/*
  Старый frame обновляет отдельные строки динамически.
  Чистим текст только при изменениях, а не каждый кадр.
*/
const calmObserver = new MutationObserver(records => {
  const roots = new Set();

  records.forEach(record => {
    const element = record.target.nodeType === Node.TEXT_NODE
      ? record.target.parentElement
      : record.target;

    if (element) roots.add(element);
  });

  roots.forEach(cleanInterfaceText);
});

calmObserver.observe($('hud'), {
  subtree:true,
  childList:true,
  characterData:true
});

/* ---------------- СТАТИСТИКА ---------------- */

/*
  Включаем по умолчанию только при отсутствии решения игрока.
  Ранее сохранённое "no" не перезаписываем.
*/
const savedAnalyticsChoice = safeLocalGet(
  RELEASE_CONFIG.telemetryConsentKey
);

if (savedAnalyticsChoice === null) {
  METRICS.consent = true;

  safeLocalSet(
    RELEASE_CONFIG.telemetryConsentKey,
    'yes'
  );
} else {
  METRICS.consent = savedAnalyticsChoice === 'yes';
}

/*
  Уведомление остаётся в главном меню и меню паузы.
  Здесь речь о технических игровых событиях, а не контактах
  или персональных данных игрока.
*/
analyticsControlsHTML = function() {
  const configured = METRICS.configured();

  return `
    <div class="analyticsRow">
      <div>
        <div class="analyticsTitle">Статистика игры</div>
        <p>
          ${
            configured
              ? METRICS.consent
                ? ''
                : ''
              : ''
          }
          <br>
        </p>
      </div>

    </div>
  `;
};

bindAnalyticsToggle = function() {
  const button = $('analyticsToggle');
  if (!button) return;

  button.onclick = () => {
    METRICS.setConsent(!METRICS.consent);

    const row = button.closest('.analyticsRow');
    if (!row) return;

    const holder = document.createElement('div');
    holder.innerHTML = analyticsControlsHTML();

    row.replaceWith(holder.firstElementChild);
    bindAnalyticsToggle();
  };
};

/*
  Не дублируем событие посещения при home()/pause().
  Отправляем один раз за загрузку страницы.
*/
if (METRICS.consent && METRICS.configured()) {
  METRICS.emit('analytics_enabled', {
    reason: savedAnalyticsChoice === null
      ? 'default_enabled'
      : 'saved_enabled'
  });

  METRICS.flush();
}

function makeSacredNumberTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 768;

  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const centerX = 512;
  const centerY = 380;

  const halo = ctx.createRadialGradient(
    centerX, centerY, 30,
    centerX, centerY, 365
  );

  halo.addColorStop(0, 'rgba(255,250,208,.63)');
  halo.addColorStop(.28, 'rgba(255,224,139,.35)');
  halo.addColorStop(.62, 'rgba(255,210,110,.10)');
  halo.addColorStop(1, 'rgba(255,210,110,0)');

  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, 1024, 768);

  // Тонкий золотой круг.
  ctx.save();
  ctx.strokeStyle = 'rgba(255,232,166,.75)';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ffdd88';
  ctx.shadowBlur = 20;

  ctx.beginPath();
  ctx.arc(centerX, centerY, 252, 0, Math.PI * 2);
  ctx.stroke();

  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,246,214,.34)';
  ctx.beginPath();
  ctx.arc(centerX, centerY, 268, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Орнамент вокруг ореола.
  ctx.save();
  ctx.translate(centerX, centerY);

  for (let i = 0; i < 40; i++) {
    const angle = i / 40 * Math.PI * 2;
    const major = i % 5 === 0;

    const inner = 279;
    const outer = major ? 309 : 291;

    ctx.strokeStyle = major
      ? 'rgba(255,240,187,.8)'
      : 'rgba(255,236,175,.38)';

    ctx.lineWidth = major ? 3 : 1;

    ctx.beginPath();
    ctx.moveTo(
      Math.cos(angle) * inner,
      Math.sin(angle) * inner
    );
    ctx.lineTo(
      Math.cos(angle) * outer,
      Math.sin(angle) * outer
    );
    ctx.stroke();
  }

  ctx.restore();

  // Сами цифры.
  ctx.font = '900 348px Georgia,serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.save();
  ctx.shadowColor = '#ffeab0';
  ctx.shadowBlur = 44;
  ctx.fillStyle = '#fff1ba';
  ctx.fillText('67', centerX, centerY + 16);
  ctx.restore();

  const gold = ctx.createLinearGradient(0, 220, 0, 540);
  gold.addColorStop(0, '#fffde4');
  gold.addColorStop(.29, '#fff0b3');
  gold.addColorStop(.53, '#d39a39');
  gold.addColorStop(.70, '#ffe9a1');
  gold.addColorStop(1, '#ad722b');

  ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(111,68,18,.8)';
  ctx.strokeText('67', centerX, centerY + 16);

  ctx.fillStyle = gold;
  ctx.fillText('67', centerX, centerY + 16);

  // Небольшая звезда над цифрами.
  ctx.save();
  ctx.translate(centerX, 83);

  ctx.fillStyle = '#fff7d1';
  ctx.shadowColor = '#fff1ad';
  ctx.shadowBlur = 16;

  ctx.beginPath();
  ctx.moveTo(0, -24);
  ctx.lineTo(5, -5);
  ctx.lineTo(22, 0);
  ctx.lineTo(5, 5);
  ctx.lineTo(0, 24);
  ctx.lineTo(-5, 5);
  ctx.lineTo(-22, 0);
  ctx.lineTo(-5, -5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = Math.min(
    4,
    renderer.capabilities.getMaxAnisotropy()
  );

  return texture;
}

function makeSacredRaysTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 768;

  const ctx = canvas.getContext('2d');
  ctx.translate(384, 384);

  for (let i = 0; i < 24; i++) {
    const angle = i / 24 * Math.PI * 2;

    ctx.save();
    ctx.rotate(angle);

    const gradient = ctx.createLinearGradient(0, -60, 0, -375);
    gradient.addColorStop(0, 'rgba(255,232,166,0)');
    gradient.addColorStop(.3, 'rgba(255,232,166,.16)');
    gradient.addColorStop(1, 'rgba(255,232,166,0)');

    ctx.fillStyle = gradient;

    ctx.beginPath();
    ctx.moveTo(-3, -65);
    ctx.lineTo(-20, -370);
    ctx.lineTo(20, -370);
    ctx.lineTo(3, -65);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

  if (!element) return;

  const textNode = Array.from(element.childNodes)
    .find(node => node.nodeType === Node.TEXT_NODE);

  if (textNode) textNode.nodeValue = text;
}

function updateDeviceLayout() {
  DEVICE_UI.compact =
    innerWidth <= 600 ||
    (innerHeight <= 500 && innerWidth > innerHeight);

  DEVICE_UI.landscape = innerWidth > innerHeight;

  document.body.dataset.gameMode = mode;
  document.body.dataset.input =
    DEVICE_UI.coarse.matches ? 'touch' : 'pointer';

  $('pauseButton').textContent =
    DEVICE_UI.compact ? 'Ⅱ' : 'Пауза';

  moveAxis = 0;

*/
function preventGameSelection(event) {
  if (!playing || paused) return;
  event.preventDefault();
}

  'selectstart',

);

  'dragstart',

);

);

    if (event.cancelable) event.preventDefault();
  },
  { passive:false }
);

  'touchmove',
  event => {
    if (!playing || paused) return;
    if (event.cancelable) event.preventDefault();
  },
  { passive:false }
);

/*
  Если браузер уже успел создать выделение,
  убираем его при начале нового движения.
*/
$('moveZone').addEventListener('pointerdown', () => {
  if (!playing || paused) return;

  const selection = window.getSelection?.();

  if (selection && !selection.isCollapsed) {
    selection.removeAllRanges();
  }
});

function choosePraise(category) {
  const list = PICKME_PRAISE[category] || PICKME_PRAISE.hit;

  let index = Math.floor(Math.random() * list.length);

  if (
    list.length > 1 &&
    list[index][0] === DEVICE_UI.lastPraise
  ) {
    index = (index + 1) % list.length;
  }

  DEVICE_UI.lastPraise = list[index][0];
  return list[index];
}

function escapePraiseText(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function showPickmePraise(category, resultLabel) {
  const [title, detail] = choosePraise(category);

  const isMiss =
    category === 'miss' ||
    category === 'overhead' ||
    category === 'passed';

  const color = isMiss
    ? '#ffe5d7'
    : category === 'perfect'
      ? '#fff0b1'
      : '#e1f4e7';

  /*
    На телефоне оставляем результат и одну короткую реплику.
    Длинное пояснение не заслоняет ноги.
  */
  const compact =
    DEVICE_UI.coarse.matches ||
    DEVICE_UI.compact;

  $('message').innerHTML = `
    <span class="praiseResult">
      ${escapePraiseText(resultLabel)}
    </span>
    <span class="praiseMain">
      ${escapePraiseText(title)}
    </span>
    ${
      compact
        ? ''
        : `<small>${escapePraiseText(detail)}</small>`
    }
  `;

  $('message').style.color = color;
  $('message').style.opacity = 1;

  messageTime = compact ? 1.55 : 2.25;
}

/*
  Старые сообщения удара заменяем, а не выводим вторым слоем.
  Остальные подсказки игры работают как раньше.
*/
const deviceSay = say;

say = function(title, sub = '', color = 'white', seconds = 2) {
  if (DEVICE_UI.suppressImpactMessage) return;
  deviceSay(title, sub, color, seconds);
};

const deviceApplyImpact = applyImpact;

applyImpact = function() {
  DEVICE_UI.suppressImpactMessage = true;

  try {
    deviceApplyImpact();
  } finally {
    DEVICE_UI.suppressImpactMessage = false;
  }

  if (!shot) return;

  if (pendingBack) {
    showPickmePraise(
      shot.overhead ? 'overhead' : 'miss',
      shot.overhead ? 'ВЫШЕ ПРЕДМЕТА' : 'ПРОМАХ'
    );
  } else if (shot.perfect) {
    showPickmePraise(
      'perfect',
      'ИДЕАЛЬНЫЙ УДАР'
    );
  } else {
    showPickmePraise(
      'hit',
      'ПОПАДАНИЕ'
    );
  }
};

/*
  Если игрок просто прошёл предмет без удара,
  тоже поддерживаем его, но не дублируем похвалу
  после обычного промаха ногой.
*/
const deviceBeginRetreat = beginRetreat;

beginRetreat = function() {
  const missedByPassing = phase === 'walk';

  deviceBeginRetreat();

  if (missedByPassing) {
    showPickmePraise(
      'passed',
      'ПРЕДМЕТ ПОЗАДИ'
    );
  }
};

/*
  Не переписываем расчёт наград, аналитику и обработчики кнопок.
  Меняем только текст уже созданного экрана результата.
*/
const deviceEndRun = endRun;

endRun = function(won = false) {
  const wasPlaying = playing;
  const completedMode = mode;

  deviceEndRun(won);

  if (!wasPlaying) return;

  const category = completedMode === 'level'
    ? won ? 'won' : 'lost'
    : 'free';

  const [title, description] = choosePraise(category);

  const resultPanel = $('panel');
  const heading = resultPanel.querySelector('h2');
  const hero = resultPanel.querySelector('.hero');

  /*
    Заголовок исхода остаётся однозначным:
    проигрыш не называем победой.
  */
  if (heading) {
    heading.textContent = completedMode === 'level'
      ? won ? 'Уровень пройден' : 'Попытка завершена'
      : 'Прогулка завершена';
  }

  if (hero) {
    hero.innerHTML = '';

    const lead = document.createElement('strong');
    lead.textContent = title;
    lead.style.display = 'block';
    lead.style.marginBottom = '9px';
    lead.style.color = '#fff0b5';

    const body = document.createElement('span');
    body.textContent = description;

    hero.append(lead, body);
  }

  const again = $('again');

  if (
    again &&
    completedMode === 'level' &&
    !won
  ) {
    again.textContent = 'Ещё попытка? Я за тебя';
  }
};

function pinatFeminineText(text) {
  const replacements = [
    ['ПИНОК!', 'PINATNOGOI'],

    ['ты попал', 'ты попала'],
    ['Ты попал', 'Ты попала'],
    ['ты постарался', 'ты постаралась'],

    ['ты не сдавался', 'ты не сдавалась'],
    ['Ты не сдавался', 'Ты не сдавалась'],
    ['ты довёл', 'ты довела'],

    ['ты был', 'ты была'],
    ['Ты был', 'Ты была'],

    ['ты сейчас хорошо попал', 'ты сейчас хорошо попала'],
    ['Ты сейчас хорошо попал', 'Ты сейчас хорошо попала'],
    ['поймал ритм', 'поймала ритм'],
    ['поймал момент', 'поймала момент'],
    ['подошёл', 'подошла'],
    ['Подошёл', 'Подошла'],
    ['Сначала выровняйся', 'Сначала выровняйся'],

    ['чемпион!', 'чемпионка!'],
    ['Чемпион!', 'Чемпионка!'],
    ['какой же ты молодец', 'какая же ты умница'],
    ['Какой же ты молодец', 'Какая же ты умница']
  ];

  let result = text;

  for (const [from, to] of replacements) {
    result = result.split(from).join(to);
  }

  return result;
}

function pinatPolishText(root) {
  if (!root) return;

  const walker = document.createTreeWalker(
    root,
    NodeFilter.SHOW_TEXT
  );

  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  for (const node of nodes) {
    const replacement = pinatFeminineText(node.nodeValue);

    if (replacement !== node.nodeValue) {
      node.nodeValue = replacement;
    }
  }

  root.querySelectorAll?.('.brand').forEach(element => {
    if (element.textContent !== PINAT_THEME.name) {
      element.textContent = PINAT_THEME.name;
    }

    element.setAttribute('aria-label', PINAT_THEME.name);
  });
}

  pinatPreviousPanel(html);
  pinatPolishText($('panel'));

  Некоторые экраны меняют текст уже после вызова panel().
  Отслеживаем такие изменения без пересоздания интерфейса.
*/
const pinatPanelObserver = new MutationObserver(() => {
  pinatPolishText($('panel'));

/* ---------------- ПОКАЗ ОБЛАЧКА ---------------- */

function pinatAnimateBubble() {
  const element = $('message');

  element.classList.remove('bubbleArrive');

  if (!reducedMotion) {
    // Перезапускаем короткую анимацию только при новой реплике.
    void element.offsetWidth;
    element.classList.add('bubbleArrive');
  }
}

showPickmePraise = function(category, resultLabel) {
  const [title, detail] = choosePraise(category);

  const compact =
    DEVICE_UI.coarse.matches ||
    DEVICE_UI.compact;

  const resultLabels = {
    perfect:'ИДЕАЛЬНО',
    hit:'ПОПАЛА',
    miss:'ЧУТЬ МИМО',
    overhead:'ВЫШЕ ПРЕДМЕТА',
    passed:'ВЕРНЁМСЯ К ПРЕДМЕТУ'
  };

  const label = resultLabels[category] || resultLabel;

  $('message').dataset.praiseKind = category;

  $('message').innerHTML = `
    <span class="praiseResult">
      ${escapePraiseText(label)}
    </span>
    <span class="praiseMain">
      ${escapePraiseText(title)}
    </span>
    ${
      compact
        ? ''
        : `<small>${escapePraiseText(detail)}</small>`
    }
  `;

  $('message').style.opacity = 1;

  messageTime = compact
    ? PINAT_THEME.bubbleDurationMobile
    : PINAT_THEME.bubbleDurationDesktop;

  pinatAnimateBubble();
};

/*
  Обычные подсказки тоже получают мягкое оформление,
  но сохраняют свои исходные функции и смысл.

/* ============================================================

/* ============================================================
   PINATNOGOI — COMFORT & POLISH
   Спокойная камера / мягкий звук / детализация интерфейса
   ============================================================ */

const COMFORT_KEYS = {
  camera: 'pinat-camera-comfort-v1',
  volume: 'pinat-audio-volume-v1'
};

const savedComfortVolume = Number(
  safeLocalGet(COMFORT_KEYS.volume) ?? '0.32'
);

const COMFORT = {
  cameraMode:
    safeLocalGet(COMFORT_KEYS.camera) === 'down'
      ? 'down'
      : 'calm',

  volume: Number.isFinite(savedComfortVolume)
    ? clamp(savedComfortVolume, 0, .65)
    : .32,

  pitch: Math.atan2(1.60 - .065, .55),
  yaw: 0,

  tracking: false,
  trackingTime: 0,
  quietTime: 0,

  initialized: false,
  lastPlaying: false,

  audioContext: null,
  audioBus: null,
  noiseBuffer: null
};

/* ---------------- СПОКОЙНАЯ КАМЕРА ---------------- */

function comfortMoveTowards(value, target, speed, dt) {
  const distance = target - value;
  const step = speed * dt;

  return value + clamp(distance, -step, step);
}

function resetComfortCamera() {
  COMFORT.pitch = Math.atan2(1.60 - .065, .55);
  COMFORT.yaw = 0;

  COMFORT.tracking = false;
  COMFORT.trackingTime = 0;
  COMFORT.quietTime = 0;
  COMFORT.initialized = false;
}

const comfortStartRun = startRun;

startRun = function(newMode, level = null) {
  resetComfortCamera();
  comfortStartRun(newMode, level);
};

const comfortHome = home;

home = function() {
  resetComfortCamera();
  comfortHome();
};

const comfortPreviousWorld = updateWorld;

updateWorld = function(dt) {
  /*
    Предыдущие версии продолжают обновлять персонажа,
    траву, освещение, тени и небесное 67.

    Финальное положение камеры задаётся ниже.
  */
  comfortPreviousWorld(dt);

  const mobileView =
    matchMedia('(pointer:coarse)').matches ||
    innerWidth <= 600;

  const active = playing && !paused;
  const delta = active ? Math.min(.05, dt) : 0;

  const basePitch = Math.atan2(1.60 - .065, .55);

  if (
    !COMFORT.initialized ||
    COMFORT.lastPlaying !== playing
  ) {
    COMFORT.initialized = true;
    COMFORT.lastPlaying = playing;

    COMFORT.pitch = basePitch;
    COMFORT.yaw = 0;
    COMFORT.tracking = false;
    COMFORT.trackingTime = 0;
    COMFORT.quietTime = 0;
  }

  const forwardGap = gap();
  const objectSpeed = velocity.length();

  const fixedDown =
    COMFORT.cameraMode === 'down' ||
    reducedMotion;

  /*
    Небольшие удары больше не дёргают взгляд вверх.

    Разные границы начала и окончания предотвращают
    переключение камеры туда-сюда возле одной дистанции.
  */
  const canStartTracking =
    active &&
    !fixedDown &&
    lookFlight &&
    phase !== 'back' &&
    forwardGap > (mobileView ? 6.5 : 5.0) &&
    objectSpeed > (mobileView ? 3.2 : 2.7);

  if (!COMFORT.tracking && canStartTracking) {
    COMFORT.tracking = true;
    COMFORT.trackingTime = 0;
    COMFORT.quietTime = 0;
  }

  if (COMFORT.tracking && delta > 0) {
    COMFORT.trackingTime += delta;

    const timeToReturn =
      fixedDown ||
      phase === 'back' ||
      forwardGap < 3.1 ||
      objectSpeed < .35;

    COMFORT.quietTime = timeToReturn
      ? COMFORT.quietTime + delta
      : 0;

    if (
      fixedDown ||
      phase === 'back' ||
      (
        COMFORT.trackingTime > 1.8 &&
        COMFORT.quietTime > .95
      )
    ) {
      COMFORT.tracking = false;
      COMFORT.quietTime = 0;
    }
  }

  let targetPitch = basePitch;
  let targetYaw = 0;

  if (COMFORT.tracking && !fixedDown) {
    const dx = objectPos.x - player.x;
    const dz = Math.max(1, player.z - objectPos.z);

    /*
      Не целимся камерой прямо в скачущий предмет.
      Его высота не должна заставлять голову кивать.
    */
    const horizontalDistance = Math.hypot(dx, dz);

    const naturalTrackingPitch = Math.atan2(
      1.60 - .12,
      horizontalDistance + .8
    );

    // Ограничиваем высоту подъёма взгляда.
    targetPitch = clamp(
      naturalTrackingPitch,
      mobileView ? .47 : .36,
      basePitch
    );

    // Не водим головой за каждым боковым отскоком.
    targetYaw = clamp(
      Math.atan2(dx, dz),
      mobileView ? -.22 : -.32,
      mobileView ? .22 : .32
    );
  }

  if (delta > 0) {
    /*
      Сначала сглаживаем цель, затем ограничиваем
      максимальную угловую скорость.

      Поворот не может стать резким даже после сильного удара.
    */
    const filteredPitch = povDamp(
      COMFORT.pitch,
      targetPitch,
      mobileView ? 1.25 : 1.9,
      delta
    );

    const filteredYaw = povDamp(
      COMFORT.yaw,
      targetYaw,
      mobileView ? 1.15 : 1.7,
      delta
    );

    const lifting = targetPitch < COMFORT.pitch;

    const pitchSpeed = mobileView
      ? lifting ? .25 : .21
      : lifting ? .39 : .32;

    COMFORT.pitch = comfortMoveTowards(
      COMFORT.pitch,
      filteredPitch,
      pitchSpeed,
      delta
    );

    COMFORT.yaw = comfortMoveTowards(
      COMFORT.yaw,
      filteredYaw,
      mobileView ? .13 : .20,
      delta
    );
  }

  if (!playing) {
    COMFORT.pitch = basePitch;
    COMFORT.yaw = 0;
  }

  /*
    Камера связана с телом.
    Нет пружинящего отставания, вертикального покачивания,
    случайной тряски и изменения FOV.
  */
  camera.position.set(
    player.x,
    1.60,
    player.z - .29
  );

  const horizontal = Math.cos(COMFORT.pitch);
  const direction = V(
    Math.sin(COMFORT.yaw) * horizontal,
    -Math.sin(COMFORT.pitch),
    -Math.cos(COMFORT.yaw) * horizontal
  );

  const target = camera.position
    .clone()
    .addScaledVector(direction, 8);

  camera.up.set(0, 1, 0);
  camera.lookAt(target);

  const stableFov = innerWidth < innerHeight ? 64 : 68;

  if (camera.fov !== stableFov) {
    camera.fov = stableFov;
    camera.updateProjectionMatrix();
  }

  // Синхронизация с предыдущими слоями камеры.
  gaze.copy(target);
  naturalPOV.gaze.copy(target);
  naturalPOV.cameraPosition.copy(camera.position);

  const lift = clamp(
    (basePitch - COMFORT.pitch) /
    Math.max(.01, basePitch - .47),
    0,
    1
  );

  cameraLift = lift;
  naturalPOV.follow = lift;

  shake = 0;
  sky.position.copy(camera.position);
};

/* ---------------- МЯГКИЙ ЗВУК ---------------- */

/*
  Общая тихая шина:
  фильтр высоких частот + компрессор + регулятор громкости.

  Это синтезированный звук, не запись настоящих шагов.
*/
function ensureComfortAudio() {
  if (!save.sound || !audio) return null;

  if (
    COMFORT.audioContext === audio &&
    COMFORT.audioBus
  ) {
    return COMFORT.audioBus;
  }

  const input = audio.createGain();
  const lowpass = audio.createBiquadFilter();
  const compressor = audio.createDynamicsCompressor();
  const master = audio.createGain();

  lowpass.type = 'lowpass';
  lowpass.frequency.value = 1700;
  lowpass.Q.value = .55;

  compressor.threshold.value = -21;
  compressor.knee.value = 22;
  compressor.ratio.value = 5;
  compressor.attack.value = .012;
  compressor.release.value = .18;

  master.gain.value = COMFORT.volume;

  input.connect(lowpass);
  lowpass.connect(compressor);
  compressor.connect(master);
  master.connect(audio.destination);

  COMFORT.audioContext = audio;
  COMFORT.audioBus = { input, lowpass, compressor, master };

  // Переиспользуем шумовой буфер вместо создания на каждом шаге.
  const length = Math.floor(audio.sampleRate);
  const buffer = audio.createBuffer(1, length, audio.sampleRate);
  const samples = buffer.getChannelData(0);

  let previousSample = 0;

  for (let i = 0; i < length; i++) {
    const white = Math.random() * 2 - 1;
    previousSample = .78 * previousSample + .22 * white;
    samples[i] = previousSample * 2.2;
  }

  COMFORT.noiseBuffer = buffer;

  return COMFORT.audioBus;
}

function setComfortVolume(value) {
  COMFORT.volume = clamp(Number(value) || 0, 0, .65);

  safeLocalSet(
    COMFORT_KEYS.volume,
    String(COMFORT.volume)
  );

  const bus = ensureComfortAudio();

  if (bus && audio) {
    bus.master.gain.setTargetAtTime(
      COMFORT.volume,
      audio.currentTime,
      .035
    );
  }
}

const comfortUnlockAudio = unlockAudio;

unlockAudio = function() {
  comfortUnlockAudio();
  ensureComfortAudio();
};

/*
  Заменяем резкие треугольные сигналы на мягкий синус.
  Частоты и громкость ограничены.
  Начало и конец никогда не обрываются мгновенно.
*/
tone = function(
  frequency = 160,
  duration = .12,
  type = 'sine',
  volume = .05,
  end = .5
) {
  if (!save.sound || !audio || COMFORT.volume <= 0) return;

  const bus = ensureComfortAudio();
  if (!bus) return;

  const t = audio.currentTime;
  const length = clamp(duration, .085, .30);

  const startFrequency = clamp(frequency, 70, 620);
  const endFrequency = clamp(
    startFrequency * clamp(end, .55, 1.18),
    55,
    660
  );

  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.type = 'sine';

  oscillator.frequency.setValueAtTime(startFrequency, t);
  oscillator.frequency.exponentialRampToValueAtTime(
    endFrequency,
    t + length
  );

  const peak = clamp(volume * .50, 0, .043);

  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(
    peak,
    t + Math.min(.019, length * .25)
  );
  gain.gain.exponentialRampToValueAtTime(
    .0001,
    t + length
  );
  gain.gain.linearRampToValueAtTime(
    0,
    t + length + .02
  );

  oscillator.connect(gain);
  gain.connect(bus.input);

  oscillator.start(t);
  oscillator.stop(t + length + .025);

  oscillator.onended = () => {
    oscillator.disconnect();
    gain.disconnect();
  };
};

/*
  Шаги — приглушённый шорох без резкого "песка" в верхах.
*/
noise = function(volume = .02, duration = .075) {
  if (!save.sound || !audio || COMFORT.volume <= 0) return;

  const bus = ensureComfortAudio();

  if (!bus || !COMFORT.noiseBuffer) return;

  const t = audio.currentTime;
  const length = clamp(duration, .06, .15);

  const source = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();

  source.buffer = COMFORT.noiseBuffer;

  filter.type = 'lowpass';
  filter.frequency.value = activeUp[2] === 0 ? 620 : 1050;
  filter.Q.value = .45;

  const peak = clamp(volume * .55, 0, .026);

  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(peak, t + .014);
  gain.gain.exponentialRampToValueAtTime(
    .0001,
    t + length
  );
  gain.gain.linearRampToValueAtTime(
    0,
    t + length + .018
  );

  source.connect(filter);
  filter.connect(gain);
  gain.connect(bus.input);

  source.start(t, Math.random() * .65);
  source.stop(t + length + .02);

  source.onended = () => {
    source.disconnect();
    filter.disconnect();
    gain.disconnect();
  };
};

/*
  Победа больше не звучит как громкий сигнал.
  Короткая тихая музыкальная фраза.
*/
cheer = function() {
  if (!save.sound || COMFORT.volume <= 0) return;

  [261.63, 329.63, 392].forEach((frequency, index) => {
    setTimeout(() => {
      tone(frequency, .22, 'sine', .036, 1);
    }, index * 155);
  });
};

function bindComfortSettings() {
  const cameraButton = $('comfortCamera');
  const volumeSlider = $('comfortVolume');

  if (cameraButton) {
    cameraButton.onclick = () => {
      COMFORT.cameraMode =
        COMFORT.cameraMode === 'calm' ? 'down' : 'calm';

      safeLocalSet(
        COMFORT_KEYS.camera,
        COMFORT.cameraMode
      );

      cameraButton.textContent =
        COMFORT.cameraMode === 'down'
          ? 'Только вниз'
          : 'Спокойная';

      /*
        Не дёргаем камеру при нажатии.
        После продолжения она плавно вернётся вниз.
      */
      if (COMFORT.cameraMode === 'down') {
        COMFORT.tracking = false;
      }
    };
  }

  if (volumeSlider) {
    volumeSlider.addEventListener('input', () => {
      unlockAudio();

      const value = Number(volumeSlider.value);
      setComfortVolume(value / 100 * .65);

      $('comfortVolumeValue').textContent = value + '%';
    });

    // Один тихий пример после завершения регулировки.
    volumeSlider.addEventListener('change', () => {
      tone(261.63, .17, 'sine', .035, 1);
    });
  }
}

const ITEM_POINTER = {
  projected: V(),
  cameraSpace: V(),
  wasVisible: false,
  distanceElement: document.getElementById('itemPointerDistance'),
  arrowElement: document.getElementById('itemPointerArrow')
};

function hideItemPointer() {
  itemPointer.classList.remove('isVisible');
  ITEM_POINTER.wasVisible = false;
}

function updateItemPointer() {
  if (!playing || paused) {
    hideItemPointer();
    return;
  }

  /*
    Используем фактическую ориентацию камеры после всех
    обновлений комфортного режима.
  */
  camera.updateMatrixWorld(true);

  ITEM_POINTER.cameraSpace
    .copy(objectPos)
    .applyMatrix4(camera.matrixWorldInverse);

  ITEM_POINTER.projected
    .copy(objectPos)
    .project(camera);

  const view = ITEM_POINTER.cameraSpace;
  const ndc = ITEM_POINTER.projected;

  const inFront = view.z < -.035;
  const validProjection =
    Number.isFinite(ndc.x) &&
    Number.isFinite(ndc.y);

  /*
    Небольшой запас у края экрана.
    Разные пороги включения и выключения предотвращают мигание.
  */
  const visibleLimit = ITEM_POINTER.wasVisible ? .80 : .91;

  const clearlyOnScreen =
    inFront &&
    validProjection &&
    Math.abs(ndc.x) < visibleLimit &&
    Math.abs(ndc.y) < visibleLimit &&
    ndc.z >= -1 &&
    ndc.z <= 1;

  if (clearlyOnScreen) {
    hideItemPointer();
    return;
  }

  const width = innerWidth;
  const height = innerHeight;

  const landscapePhone =
    height <= 500 && width > height;

  const compact =
    width <= 600 ||
    matchMedia('(pointer:coarse)').matches;

  /*
    Направление в экранных координатах.
    Для предмета за камерой используем координаты камеры,
    чтобы стрелка не показывала зеркально неверную сторону.
  */
  let dx;
  let dy;

  if (inFront && validProjection) {
    dx = ndc.x * width * .5;
    dy = -ndc.y * height * .5;
  } else {
    dx = view.x;
    dy = -view.y;

    // Если предмет практически точно позади — стрелка вниз.
    if (Math.hypot(dx, dy) < .01) {
      dx = 0;
      dy = 1;
    }
  }

  const length = Math.hypot(dx, dy);

  if (!Number.isFinite(length) || length < .0001) {
    hideItemPointer();
    return;
  }

  dx /= length;
  dy /= length;

  /*
    Рабочая рамка:
    сверху оставляем место HUD и облачку,
    снизу — заряду и кнопке.
  */
  const hudStyle = getComputedStyle($('hud'));

  const safeLeft = parseFloat(hudStyle.paddingLeft) || 10;
  const safeRight = parseFloat(hudStyle.paddingRight) || 10;
  const safeTop = parseFloat(hudStyle.paddingTop) || 10;

  const left = safeLeft + 25;
  const right = width - safeRight - 25;

  const top = landscapePhone
    ? safeTop + 110
    : compact
      ? safeTop + 168
      : safeTop + 190;

  const bottom = landscapePhone
    ? height - 116
    : height - (compact ? 185 : 190);

  /*
    На очень низком экране сокращаем рамку,
    но не даём ей перевернуться.
  */
  const minY = Math.min(top, height * .43);
  const maxY = Math.max(bottom, minY + 28);

  const centerX = width * .5;
  const centerY = clamp(height * .5, minY, maxY);

  const tx = Math.abs(dx) > .0001
    ? (dx > 0 ? right - centerX : left - centerX) / dx
    : Infinity;

  const ty = Math.abs(dy) > .0001
    ? (dy > 0 ? maxY - centerY : minY - centerY) / dy
    : Infinity;

  const edgeDistance = Math.max(0, Math.min(tx, ty));

  const x = clamp(centerX + dx * edgeDistance, left, right);
  const y = clamp(centerY + dy * edgeDistance, minY, maxY);

  /*
    SVG нарисован направленным вверх:
    +90° переводит atan2 в нужную ориентацию.
  */
  const angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;

  itemPointer.style.left = x.toFixed(1) + 'px';
  itemPointer.style.top = y.toFixed(1) + 'px';

  ITEM_POINTER.arrowElement.style.transform =
    'rotate(' + angle.toFixed(1) + 'deg)';

  const distance = Math.hypot(
    objectPos.x - player.x,
    objectPos.z - player.z
  );

  const distanceText = distance < 10
    ? distance.toFixed(1).replace('.', ',') + ' м'
    : Math.round(distance) + ' м';

  if (ITEM_POINTER.distanceElement.textContent !== distanceText) {
    ITEM_POINTER.distanceElement.textContent = distanceText;
  }

  itemPointer.classList.add('isVisible');
  ITEM_POINTER.wasVisible = true;
}

const pointerPreviousWorld = updateWorld;

updateWorld = function(dt) {
  pointerPreviousWorld(dt);
  updateItemPointer();
};

/* Сразу скрываем при открытии меню, не ожидая следующего кадра. */
const pointerPreviousPanel = panel;

panel = function(html) {
  hideItemPointer();
  pointerPreviousPanel(html);
};

/* ============================================================
   КОНЕЦ УКАЗАТЕЛЯ ПРЕДМЕТА
   ============================================================ */
let previous=performance.now(),saveClock=0;
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,Math.max(0,(now-previous)/1000));previous=now;
 if(playing&&!paused){
  const steps=Math.max(1,Math.ceil(dt/.012));
  for(let i=0;i<steps;i++){
   if(playing&&!paused)updateGame(dt/steps);
  }
  updateDust(dt);updateWorld(dt);
  saveClock+=dt;
  if(saveClock>4){saveClock=0;persist()}
 }else{
  // Обновляем модели после покупки, не продвигая игровое время.
  updateWorld(.016);
 }
 renderer.render(scene,camera);
}
home();updateWorld(.1);
$('loading').classList.add('hidden');
requestAnimationFrame(frame);
</script>
